<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasugchi · Apps</title>
<meta name="description" content="Aplicaciones web de Kasugchi: rutas offline, estantería 3D y otros proyectos.">
<meta name="theme-color" content="#1F2A2E">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Concepto: un panel perforado de taller donde cuelgan las herramientas (apps) */
:root{
  --bg:#ECE9E2; --hole:#D2CDC2; --card:#FBFAF7; --ink:#1F2A2E; --muted:#5F6A6D; --line:#D9D4CA;
  --accent:#E0702A; --accent-ink:#FFFFFF; --chip:#EFEBE3;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171C1E; --hole:#252C2F; --card:#20272A; --ink:#ECEFEE; --muted:#9BA6A8; --line:#313A3D;
  --accent:#F08A45; --accent-ink:#1A0E05; --chip:#2A3235; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);
  background-image:radial-gradient(circle at center,var(--hole) 2.2px,transparent 2.6px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left));padding-block:max(28px,env(safe-area-inset-top)) max(40px,env(safe-area-inset-bottom))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
header{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.tag{align-self:flex-start;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,9vw,88px);line-height:.92;letter-spacing:-.03em;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.lead{max-width:34em;margin:0;color:var(--muted);font-size:18px}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0 0 16px;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.app{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;
  box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(0,0,0,.35);transition:transform .18s ease,box-shadow .18s ease}
.app::before{content:"";position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
@media (hover:hover){.app:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 1px 0 var(--line),0 18px 30px -18px rgba(0,0,0,.45)}}
.app-head{display:flex;gap:14px;align-items:center}
.app-head img{width:56px;height:56px;border-radius:14px;flex:none;background:var(--chip)}
.app-head h3{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.15;margin:0}
.app-head .url{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.app p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.chips li{font-size:13px;background:var(--chip);border-radius:6px;padding:2px 8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:15px;border-radius:9px;padding:9px 16px;border:1px solid var(--line);color:var(--ink);background:transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;border-top:1px dashed var(--line);padding-top:18px}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){.app{transition:none}.app:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">kasugchi.github.io</span>
    <h1>Kasug<span>chi</span>.</h1>
    <p class="lead">Aplicaciones hechas a mano para el día a día. Se abren en el navegador y se pueden instalar en el móvil como una app más.</p>
  </header>

  <section aria-labelledby="t-apps">
    <h2 id="t-apps">Aplicaciones <small id="count"></small></h2>
    <div class="apps" id="apps"></div>
  </section>

  <footer>
    <span>Hecho por Kasugchi</span>
    <a href="https://github.com/Kasugchi">github.com/Kasugchi</a>
  </footer>
</div>

<script>
// ¿App nueva? Añade un bloque aquí y aparecerá sola en la página.
const APPS = [
  {
    name: 'Rutas Offline',
    url: 'rutas/',
    icon: 'rutas/icons/icon-192.png',
    desc: 'Registro de paradas, repostajes y gastos de viaje con GPS, foto del ticket y mapa de la ruta.',
    chips: ['Funciona sin conexión', 'Instalable', 'Excel y JSON'],
    extra: [{ label: 'Guía rápida', url: 'rutas/instrucciones_rutas.html' }]
  },
  {
    name: 'Estantería 3D',
    url: 'estanteria/',
    icon: 'estanteria/icon-192.png',
    desc: 'Mapa en 3D de una estantería: dónde está cada caja, leído desde Google Sheets o Excel.',
    chips: ['3D', 'Instalable', 'Google Sheets']
  },
  {
    name: 'Biblioteca escolar',
    url: 'biblioteca/',
    icon: 'biblioteca/icon-192.png',
    desc: 'Inventario visual de la biblioteca de un colegio: dónde está cada libro, físicos y digitales, y préstamos a profesores.',
    chips: ['3D', 'Instalable', 'Préstamos', 'Excel']
  }
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('count').textContent = APPS.length + (APPS.length === 1 ? ' app' : ' apps');
document.getElementById('apps').innerHTML = APPS.map(a => `
  <article class="app">
    <div class="app-head">
      <img src="${esc(a.icon)}" alt="" width="56" height="56" loading="lazy">
      <div><h3>${esc(a.name)}</h3><span class="url">/${esc(a.url)}</span></div>
    </div>
    <p>${esc(a.desc)}</p>
    <ul class="chips">${(a.chips || []).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    <div class="actions">
      <a class="btn primary" href="${esc(a.url)}">Abrir</a>
      ${(a.extra || []).map(x => `<a class="btn" href="${esc(x.url)}">${esc(x.label)}</a>`).join('')}
    </div>
  </article>`).join('');
</script>
</body>
</html>
