<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La cinta de las tareas</title><link rel="stylesheet" href="estilo.css">
<style>
#esc{background:linear-gradient(#ffe9b5,#ffcf7a);padding:12px;min-height:520px}
.fila{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tort{width:30%;text-align:center;position:relative}
.tort .cara{font-size:64px;line-height:1}
.tort .nom{font-weight:700;font-size:15px}
.bub{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:#fff;border:3px solid var(--tinta);border-radius:14px;padding:6px 8px;font-size:14px;font-weight:700;min-width:130px;max-width:180px;display:none;z-index:4}
.bub.on{display:block;animation:salto .4s}
.centro{flex:1;text-align:center}
.cinta{height:26px;margin:10px 0;border:3px solid var(--tinta);border-radius:14px;background:repeating-linear-gradient(90deg,#555 0 22px,#777 22px 44px);background-size:44px 100%;animation:cinta 1s linear infinite}
@keyframes cinta{to{background-position:44px 0}}
.tarea{background:#fff;border:4px solid var(--tinta);border-radius:18px;padding:10px;animation:entra .4s ease-out;box-shadow:var(--sombra)}
.tarea.sueno{background:#fff3b0;border-color:#b8860b}
@keyframes entra{from{transform:translateY(-60px) scale(.6);opacity:0}}
.tarea .em{font-size:64px;line-height:1}
.tiempo{height:12px;background:#0002;border-radius:8px;overflow:hidden;margin-top:6px}.tiempo i{display:block;height:100%;background:var(--rojo)}
.botones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.botones .btn{text-align:center;padding:12px 4px;font-size:16px}
#msg{min-height:2.6em;font-weight:700;text-align:center;margin-top:8px}
.just{margin-top:10px;font-weight:700}
@media(max-width:480px){.tort .cara{font-size:46px}.bub{font-size:12px;min-width:100px}}
</style></head>
<body><main>
<div class="juego-cab"><a href="index.html">← Volver</a><button class="mudo" id="mu"></button></div>
<h1>🐢 La cinta de las tareas</h1>
<p class="nota">Inspirado en <i>Arturo y Clementina</i>. Las tareas llegan por la cinta: ¡envíalas antes de que se acabe el tiempo! Cuida que nadie se agote y que el reparto sea <b>justo</b>. Teclas: ← Arturo · ↓ los dos · → Clementina.</p>
<div id="ini" class="tarjeta" style="text-align:center"><div class="grande">🐢🐢</div><button class="btn" id="go" style="font-size:22px">▶ ¡Empezar!</button></div>
<div class="escena" id="esc" hidden>
 <div class="fila">
  <div class="tort" id="ta"><div class="bub" id="bub"></div><div class="cara">🐢</div><div class="nom">Arturo</div><div class="medidor"><i id="ea"></i></div></div>
  <div class="centro"><div id="n" class="nota"></div><div class="cinta"></div><div class="tarea" id="tarea"></div><div class="tiempo"><i id="tm"></i></div></div>
  <div class="tort" id="tc"><div class="cara">🐢</div><div class="nom">Clementina</div><div class="medidor"><i id="ec"></i></div></div>
 </div>
 <div class="botones"><button class="btn" id="bA">⬅ Arturo</button><button class="btn" id="bD" style="background:#9be39f">🤝 Los dos</button><button class="btn" id="bC">Clementina ➡</button></div>
 <div id="msg" role="status"></div>
 <div class="just">⚖️ Justicia: <span id="jt">50</span><div class="medidor"><i id="jb"></i></div></div>
</div>
<div id="fin"></div>
</main>
<script src="comun.js"></script>
<script>
botonSonido(document.getElementById('mu'));
const $ = (i) => document.getElementById(i);
const TRAB = [['🍳', 'Cocinar', 20], ['🧹', 'Barrer', 15], ['🛒', 'Cargar la compra', 40, 1], ['🧺', 'Tender la ropa', 15], ['🍽️', 'Fregar los platos', 20], ['🪟', 'Limpiar cristales', 25], ['👶', 'Cuidar a los peques', 30, 1], ['🗑️', 'Sacar la basura', 10], ['🛏️', 'Hacer las camas', 15], ['🧽', 'Limpiar el baño', 25], ['🔧', 'Montar la estantería', 35, 1], ['🪴', 'Regar las plantas', 10]];
const SUE = [['🎨', 'Pintar un cuadro'], ['🎸', 'Tocar la guitarra'], ['📚', 'Leer un libro'], ['💃', 'Bailar']];
const EXC_T = ['¡Eso es cosa de ella!', 'Yo ya he trabajado hoy…', 'Eso no es para un tortugo como yo.', 'Ya lo hará Clementina, siempre lo hace.'];
const EXC_S = ['¿Pintar tú? Eso no es para ti.', 'Déjate de tonterías, Clementina.', 'Tú no tienes tiempo para eso.'];
let cola, k, en, just, hecho, tmr, t0, dur, cur, vivo, bloq;
const VEL = +new URLSearchParams(location.search).get('v') || 1;
function nuevaCola() { const t = barajar(TRAB).slice(0, 9).map((x) => ({ e: x[0], n: x[1], c: x[2], g: x[3], excusa: Math.random() < .6 })); const s = barajar(SUE).slice(0, 3).map((x) => ({ e: x[0], n: x[1], sueno: 1, excusa: Math.random() < .8 })); const out = []; const a = barajar(t), b = s; for (let i = 0; i < 12; i++) out.push(i % 4 === 2 && b.length ? b.pop() : a.pop()); return out; }
function empezar() { cola = nuevaCola(); k = 0; en = { a: 80, c: 80 }; just = 50; hecho = 0; vivo = true; $('ini').hidden = true; $('esc').hidden = false; $('fin').innerHTML = ''; pinta(); sig(); }
function pinta() { $('ea').style.width = Math.max(0, en.a) + '%'; $('ec').style.width = Math.max(0, en.c) + '%'; $('jt').textContent = Math.round(just); $('jb').style.width = just + '%'; }
function sig() {
  if (k >= cola.length) return final();
  bloq = false; cur = cola[k]; $('n').textContent = `Tarea ${k + 1} de ${cola.length}`;
  $('tarea').className = 'tarea' + (cur.sueno ? ' sueno' : ''); $('tarea').innerHTML = `<div class="em">${cur.e}</div><b>${cur.sueno ? '✨ Tiempo para soñar: ' : ''}${cur.n}</b>${cur.c ? `<div class="nota">Cansa: ${cur.c}${cur.g ? ' (¡muy pesada!)' : ''}</div>` : '<div class="nota">Recarga energía</div>'}`;
  const b = $('bub'); if (cur.excusa) { b.textContent = uno(cur.sueno ? EXC_S : EXC_T); b.classList.add('on'); } else b.classList.remove('on');
  dur = Math.max(3500, 6500 - k * 250) / VEL; t0 = performance.now(); clearInterval(tmr);
  tmr = setInterval(() => { const f = (performance.now() - t0) / dur; $('tm').style.width = (100 - f * 100) + '%'; if (f >= 1) { clearInterval(tmr); juzga(null); } }, 40);
}
const uno = (l) => l[Math.floor(Math.random() * l.length)];
function juzga(d) {
  if (!vivo || bloq) return; bloq = true; clearInterval(tmr); let j = 0, m = '', ok = true;
  if (!d) { en.a -= 8; en.c -= 8; j = -6; m = '⏰ ¡Se acumuló la tarea!'; ok = false; }
  else if (cur.sueno) {
    const dd = d === 'a' ? ['a'] : d === 'c' ? ['c'] : ['a', 'c']; dd.forEach((x) => en[x] = Math.min(100, en[x] + 25));
    if (d === 'd') { j = 12; m = '🎉 ¡Los dos disfrutan!'; } else if (d === 'c') { j = cur.excusa ? 16 : 10; m = '🎨 ¡Clementina hace lo que le gusta!'; } else { j = cur.excusa ? -10 : 3; m = '😕 Arturo se lo queda todo. Clementina también necesita sus sueños.'; ok = j > 0; }
  } else if (d === 'd') { en.a -= cur.c / 2; en.c -= cur.c / 2; j = cur.g ? 12 : cur.excusa ? 6 : 3; m = cur.g ? '🤝 ¡Entre los dos, la pesada se aguanta mejor!' : '🙂 Vale, pero una tarea pequeña también puede hacerla una persona.'; }
  else {
    en[d] -= cur.c; const o = d === 'a' ? 'c' : 'a';
    if (cur.excusa) { if (d === 'c') { j = -15; m = '😠 Arturo se ha escaqueado. ¡No es justo!'; ok = false; } else { j = 14; m = '💪 ¡Arturo también sabe hacerlo!'; } }
    else if (en[d] + cur.c >= en[o] - 5) { j = cur.g ? -5 : 9; m = cur.g ? '😓 Eso pesaba demasiado para uno solo.' : '👍 Bien repartido.'; ok = j > 0; }
    else { j = -8; m = '😴 Estaba más cansado/a: mejor el otro.'; ok = false; }
  }
  just = Math.max(0, Math.min(100, just + j)); if (j > 0) hecho++;
  const pad = $('esc'); flota(pad, (j >= 0 ? '+' : '') + j, j >= 0 ? '#2e7d32' : '#c62828', d === 'a' ? 15 : d === 'c' ? 85 : 50, 45);
  (ok ? sOk : sMal)(); $('msg').textContent = m;
  [d === 'a' || d === 'd' ? 'ta' : null, d === 'c' || d === 'd' ? 'tc' : null].forEach((x) => { if (x) { const e = $(x).querySelector('.cara'); e.classList.remove('salto'); void e.offsetWidth; e.classList.add('salto'); } });
  pinta();
  if (en.a <= 0 || en.c <= 0) { vivo = false; return final(true); }
  k++; setTimeout(sig, 900 / Math.min(VEL, 3));
}
function final(agotado) {
  clearInterval(tmr); $('esc').hidden = true;
  const est = agotado ? 0 : just >= 70 ? 3 : just >= 45 ? 2 : 1; if (est) ponSello('arturo', est); if (est >= 2) { confeti(); sFanfarria(); } else sMal();
  $('fin').innerHTML = `<section class="tarjeta" style="text-align:center"><div class="grande">${agotado ? '😴' : '🏆'}</div><h2>${agotado ? '¡Alguien se ha agotado!' : 'Fin de la jornada'}</h2>
  <p>${agotado ? 'Cuando una sola persona carga con todo, acaba sin fuerzas. ¡Inténtalo repartiendo mejor!' : `Justicia: <b>${Math.round(just)}</b> · ${estrellasTxt(est, 3)}`}</p>
  <h3>Para pensar</h3><ul style="text-align:left"><li>¿Qué excusas ponía Arturo? ¿Eran razones de verdad?</li><li>¿Quién hace en tu casa cada una de estas tareas?</li></ul>
  <button class="btn" onclick="empezar()">Jugar otra vez</button> <a class="btn" style="text-decoration:none;display:inline-block" href="index.html">Volver</a></section>`;
}
$('go').onclick = empezar; $('bA').onclick = () => juzga('a'); $('bD').onclick = () => juzga('d'); $('bC').onclick = () => juzga('c');
addEventListener('keydown', (e) => { if ($('esc').hidden) return; if (e.key === 'ArrowLeft') juzga('a'); if (e.key === 'ArrowRight') juzga('c'); if (e.key === 'ArrowDown') juzga('d'); });
</script></body></html>
