<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rescate en la casa grande</title><link rel="stylesheet" href="estilo.css">
<style>
#wrap{position:relative;max-width:380px;margin:0 auto}
canvas{display:block;width:100%;height:auto;touch-action:none;background:#2a1f3d}
#hud{position:absolute;left:0;right:0;top:0;padding:8px 10px;color:#fff;font-weight:700;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 0 #000a}
#q{position:absolute;left:8px;right:8px;top:36px;background:#fff;color:var(--tinta);border:4px solid var(--tinta);border-radius:14px;padding:6px 10px;text-align:center;font:700 22px "Comic Sans MS","Chalkboard SE",cursive;pointer-events:none;min-height:50px;display:flex;align-items:center;justify-content:center}
#vel{position:absolute;inset:0;background:#000a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
#vel[hidden]{display:none}
.ctl{display:flex;gap:8px;margin-top:8px}.ctl .btn{flex:1;text-align:center;font-size:22px}
</style></head>
<body><main>
<div class="juego-cab"><a href="index.html">← Volver</a><button class="mudo" id="mu"></button></div>
<h1>🐭 Rescate en la casa grande</h1>
<p class="nota">Inspirado en <i>Una feliz catástrofe</i>. Florentina corre por la casa para salvar a sus ratoncitos. Cruza la <b>puerta con la respuesta correcta</b>. Toca la zona izquierda, centro o derecha, o usa ← →. ¡Y recoge quesitos!</p>
<div class="escena" id="wrap"><canvas id="c" width="360" height="560" aria-label="Juego de carriles"></canvas>
 <div id="hud"><span id="vi"></span><span id="sc"></span><span id="re"></span></div><div id="q"></div>
 <div id="vel"></div></div>
<div class="ctl"><button class="btn" id="bl" aria-label="Izquierda">⬅</button><button class="btn" id="bc" aria-label="Centro">⬆</button><button class="btn" id="br" aria-label="Derecha">➡</button></div>
</main>
<script src="comun.js"></script>
<script>
botonSonido(document.getElementById('mu'));
const cv = document.getElementById('c'), cx = cv.getContext('2d'), W = 360, H = 560, PY = 470, LX = [60, 180, 300], META = 8;
const VEL = +new URLSearchParams(location.search).get('v') || 1;
let vidas, salvados, pts, lane, px, fila, quesos, hist, off, corre, ult, shake, parts, q, t;
const $ = (i) => document.getElementById(i);
function unicos3(c, extra) { const s = new Set([c]); for (const e of extra) { if (e > 0 && e !== c) s.add(e); if (s.size === 3) break; } let d = 1; while (s.size < 3) { s.add(c + d * (s.size % 2 ? 1 : -1) * 2); d++; } return [...s].filter((x) => x > 0).slice(0, 3); }
function gen(n) {
  let a, b, c, tx; const m = azar;
  if (n === 0) { a = m(24, 58); b = m(15, 39); c = a + b; tx = `${a} + ${b}`; }
  else if (n === 1) { a = m(61, 99); b = m(18, 49); c = a - b; tx = `${a} − ${b}`; }
  else if (n === 2 || n === 3) { a = m(3, 9); b = m(4, 9); c = a * b; tx = `${a} × ${b}`; }
  else if (n === 4 || n === 5) { b = m(3, 9); c = m(4, 9); a = b * c; tx = `${a} ÷ ${b}`; }
  else if (n === 6) { a = m(3, 6); b = m(4, 8); const x = m(2, 5); c = a * b + x; tx = `${a} bolsas de ${b} migas + ${x} sueltas`; }
  else { b = m(3, 6); const e = m(4, 8); a = b * e; const x = m(2, 7); c = e + x; tx = `${a} migas entre ${b} ratones, y +${x} cada uno`; }
  const ops = unicos3(c, [c + 1, c - 1, c + 10, c - 10, c + 2, a + b, a - b]);
  const buena = barajar(ops); return { tx: tx + ' = ?', c, nums: buena, good: buena.indexOf(c) };
}
function nuevaFila() { q = gen(salvados); $('q').textContent = q.tx; fila = { y: -80, nums: q.nums, good: q.good, hecho: false }; }
function empezar() { vidas = 3; salvados = 0; pts = 0; lane = 1; px = LX[1]; quesos = []; hist = []; off = 0; parts = []; shake = 0; corre = true; ult = performance.now(); t = 0; $('vel').hidden = true; nuevaFila(); hud(); requestAnimationFrame(bucle); }
function hud() { $('vi').textContent = '❤'.repeat(vidas) + '🖤'.repeat(3 - vidas); $('sc').textContent = '🧀 ' + pts; $('re').textContent = `🐭 ${salvados}/${META}`; }
function mover(l) { lane = Math.max(0, Math.min(2, l)); }
function bucle(now) {
  if (!corre) return; const dt = Math.min(.05, (now - ult) / 1000) * VEL; ult = now; t += dt;
  const v = (95 + salvados * 9) * 1; off = (off + v * dt) % 40; px += (LX[lane] - px) * Math.min(1, dt * 14);
  hist.unshift(px); hist.length = 120;
  fila.y += v * dt;
  if (!fila.hecho && fila.y >= PY - 10) {
    fila.hecho = true;
    if (lane === fila.good) { salvados++; sOk(); confetis(px, PY); if (salvados >= META) return fin(true); } else { vidas--; shake = .3; sMal(); if (vidas <= 0) return fin(false); }
    hud();
  }
  if (fila.y > H + 40) nuevaFila();
  if (!quesos.length && Math.random() < dt * .5 && fila.y > 60 && fila.y < 250) quesos.push({ x: LX[azar(0, 2)], y: -20 });
  quesos.forEach((c) => { c.y += v * dt; if (!c.tomado && Math.abs(c.y - PY) < 30 && Math.abs(c.x - px) < 40) { c.tomado = true; pts += 10; sMoneda(); hud(); } });
  quesos = quesos.filter((c) => c.y < H + 20 && !c.tomado);
  parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.l -= dt; }); parts = parts.filter((p) => p.l > 0);
  if (shake > 0) shake -= dt;
  dibuja(); requestAnimationFrame(bucle);
}
function confetis(x, y) { for (let i = 0; i < 16; i++) parts.push({ x, y, vx: (Math.random() - .5) * 260, vy: -Math.random() * 220, l: .8, c: ['#f2c744', '#e8590c', '#4f9a52', '#fff'][i % 4] }); }
function dibuja() {
  cx.save(); if (shake > 0) cx.translate((Math.random() - .5) * 10, (Math.random() - .5) * 10);
  const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#3b2a5c'); g.addColorStop(1, '#6b4a2f'); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  cx.fillStyle = '#0003'; for (let y = -40 + off; y < H; y += 40) cx.fillRect(0, y, W, 3);
  cx.fillStyle = '#0004'; cx.fillRect(118, 0, 2, H); cx.fillRect(240, 0, 2, H);
  quesos.forEach((c) => { cx.font = '32px serif'; cx.textAlign = 'center'; cx.fillText('🧀', c.x, c.y + 10); });
  const y = fila.y; fila.nums.forEach((n, i) => {
    cx.fillStyle = fila.hecho ? (i === fila.good ? '#4f9a52' : '#8b3a3a') : '#d4a43a'; cx.strokeStyle = '#2b1b0a'; cx.lineWidth = 5;
    cx.beginPath(); cx.roundRect(LX[i] - 48, y - 34, 96, 68, 18); cx.fill(); cx.stroke();
    cx.fillStyle = '#2b1b0a'; cx.font = 'bold 32px "Comic Sans MS", sans-serif'; cx.textAlign = 'center'; cx.fillText(n, LX[i], y + 12);
  });
  cx.font = '28px serif'; cx.textAlign = 'center'; for (let k = Math.min(salvados, META) - 1; k >= 0; k--) cx.fillText('🐭', (hist[(k + 1) * 7] ?? px) + (k - (salvados - 1) / 2) * 16, PY + 44);
  cx.font = '58px serif'; cx.textAlign = 'center'; cx.fillText('🐭', px, PY + 12);
  cx.font = '24px serif'; cx.fillText('🧣', px + 20, PY - 18);
  parts.forEach((p) => { cx.fillStyle = p.c; cx.fillRect(p.x, p.y, 6, 6); });
  cx.restore();
}
function fin(gana) {
  corre = false; dibuja(); const est = gana ? (vidas === 3 ? 3 : vidas === 2 ? 2 : 1) : 0; if (est) { ponSello('catastrofe', est); confeti(); sFanfarria(); }
  const v = $('vel'); v.hidden = false;
  v.innerHTML = gana ? `<div style="font-size:60px">🏡</div><h2 style="color:#fff">¡Hogar nuevo!</h2><p>Todos los ratoncitos están a salvo. ${estrellasTxt(est, 3)} · 🧀 ${pts}</p>` : `<div style="font-size:60px">🌊</div><h2 style="color:#fff">¡Casi!</h2><p>Has salvado ${salvados} de ${META}. Repasa la operación antes de elegir puerta.</p>`;
  v.innerHTML += '<button class="btn" id="otra">Jugar otra vez</button>'; $('otra').onclick = empezar;
}
function portada() { const v = $('vel'); v.hidden = false; v.innerHTML = '<div style="font-size:60px">🌧️🏚️🐭</div><h2 style="color:#fff">La casa se hunde…</h2><p>Elige la puerta con el resultado correcto. ¡Salva a los ratoncitos!</p><button class="btn" id="go">▶ ¡A correr!</button>'; $('go').onclick = empezar; }
cv.addEventListener('pointerdown', (e) => { const r = cv.getBoundingClientRect(); mover(Math.floor((e.clientX - r.left) / r.width * 3)); });
$('bl').onclick = () => mover(lane - 1); $('br').onclick = () => mover(lane + 1); $('bc').onclick = () => mover(1);
addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') mover(lane - 1); if (e.key === 'ArrowRight') mover(lane + 1); });
portada();
</script></body></html>
