<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Criptas · El zepelín (prototipo)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060a; color: #e6d6b0; font: 16px/1.4 'IM Fell English', Georgia, serif;
    -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
  canvas { display: block; }
  .ui { position: fixed; z-index: 10; }
  .arriba { top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .arriba > * { pointer-events: auto; }
  .titulo { font: 22px 'IM Fell English SC', serif; letter-spacing: .05em; text-shadow: 0 2px 6px #000; margin-right: auto; }
  .titulo small { display: block; font: italic 13px 'IM Fell English', serif; opacity: .6; letter-spacing: 0; }
  .btn { font: 15px 'IM Fell English', serif; color: #e6d6b0; background: rgba(20,12,8,.72); border: 1px solid #6a4a28; padding: 7px 12px; border-radius: 3px; cursor: pointer; }
  .btn:hover { border-color: #c9944a; }
  .btn.on { background: #6a2a18; border-color: #c9944a; }
  .clases { display: flex; gap: 4px; }
  .clases .btn { padding: 4px 6px; } .clases img { width: 30px; height: 30px; display: block; object-fit: contain; }
  /* Nombre flotante sobre los personajes */
  .rotulo { position: fixed; z-index: 5; transform: translate(-50%, -100%); font: 16px 'IM Fell English SC', serif; color: #f0dfb8; text-shadow: 0 1px 4px #000, 0 0 10px #000; pointer-events: none; white-space: nowrap; transition: opacity .25s; }
  /* Botón de interacción cerca de algo */
  .accion { left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); font: 19px 'IM Fell English SC', serif; padding: 12px 22px; display: none; }
  .accion kbd { font: 12px monospace; opacity: .6; margin-left: 8px; border: 1px solid #6a4a28; padding: 1px 5px; }
  /* Diálogo: papel viejo abajo */
  .dialogo { left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100vw - 20px)); display: none;
    background: radial-gradient(ellipse at 50% 40%, #e2d1a8, #b9a27a); color: #1c120b; border: 1px solid #1c120b; padding: 16px 20px 14px; box-shadow: 0 16px 40px rgba(0,0,0,.8), inset 0 0 40px rgba(60,30,8,.4); }
  .dialogo b { font: 22px 'IM Fell English SC', serif; color: #7a1a12; display: block; }
  .dialogo p { margin: 6px 0 10px; font-size: 17px; }
  .dialogo .ops { display: flex; flex-direction: column; gap: 4px; }
  .dialogo .ops button { text-align: left; font: italic 16px 'IM Fell English', serif; background: none; border: none; border-left: 2px solid transparent; padding: 4px 10px; cursor: pointer; color: #1c120b; }
  .dialogo .ops button:hover, .dialogo .ops button:focus { border-left-color: #7a1a12; background: rgba(122,26,18,.08); outline: none; }
  .dialogo .ops button::before { content: '✠ '; color: #7a1a12; font-style: normal; }
  .dialogo .lista { margin: 4px 0 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; font-size: 16px; }
  .dialogo .lista span:nth-child(even) { color: #7a1a12; }
  .aviso { left: 50%; top: 70px; transform: translateX(-50%); background: rgba(20,12,8,.88); border: 1px solid #c9944a; padding: 10px 14px; display: none; text-align: center; max-width: calc(100vw - 20px); }
  .aviso .btn { margin: 8px 4px 0; }
  .ayuda { left: 10px; bottom: max(10px, env(safe-area-inset-bottom)); font: italic 13px 'IM Fell English', serif; opacity: .55; pointer-events: none; text-shadow: 0 1px 3px #000; }
  @media (max-width: 600px) { .ayuda { display: none; } .titulo { font-size: 18px; } }
  .fps { right: 10px; bottom: 10px; font: 11px monospace; opacity: .35; pointer-events: none; }
  .fundido { position: fixed; inset: 0; z-index: 50; background: #000; pointer-events: none; opacity: 1; transition: opacity 1.2s; }
</style>
</head>
<body>
<div class="fundido" id="fundido"></div>
<div class="ui arriba">
  <div class="titulo">El Zepelín <small>prototipo · base caminable</small></div>
  <div class="clases" id="clases"></div>
  <button class="btn" id="b-completa" title="Pantalla completa">⛶</button>
  <button class="btn" id="b-libro" title="Vista ligera para móviles">📖 Ver como libro</button>
</div>
<div class="ui aviso" id="aviso"></div>
<button class="ui btn accion" id="accion"></button>
<div class="ui dialogo" id="dialogo"></div>
<div class="ui ayuda">Toca el suelo para andar · WASD / flechas · E para interactuar</div>
<div class="ui fps" id="fps"></div>

<script type="module">
import * as THREE from './js/vendor/three.module.min.js';

// =============================================================
//  Prototipo del zepelín: cubierta caminable con personajes de
//  papel (planos con dibujo), farolillos y el libro de entrada.
// =============================================================
const $ = (id) => document.getElementById(id);
const leer = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// Calidad: en móvil se baja la resolución de entrada.
const movil = matchMedia('(pointer: coarse)').matches;
let escalaPixel = Math.min(devicePixelRatio, movil ? 1.25 : 1.75);

const render = new THREE.WebGLRenderer({ antialias: !movil, powerPreference: 'high-performance' });
render.setPixelRatio(escalaPixel);
render.setSize(innerWidth, innerHeight);
render.outputColorSpace = THREE.SRGBColorSpace;
render.toneMapping = THREE.ACESFilmicToneMapping;
render.toneMappingExposure = 1.15;
document.body.appendChild(render.domElement);

const escena = new THREE.Scene();
escena.fog = new THREE.Fog(0x1a1420, 30, 95);
const camara = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 300);
const DESFASE_CAM = new THREE.Vector3(0, 11, 14), MIRA_ADELANTE = new THREE.Vector3(0, 1.2, 0);

// ---------- Cielo: degradado nocturno con estrellas ----------
{
  const c = document.createElement('canvas'); c.width = 16; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#05040a'); gr.addColorStop(.45, '#1a1426'); gr.addColorStop(.62, '#3a2430'); gr.addColorStop(.75, '#1a1420'); gr.addColorStop(1, '#0a080c');
  g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  escena.background = t;
  const n = 500, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, e = 0.15 + Math.random() * 1.2, r = 180;
    pos.set([Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r], i * 3);
  }
  const gEst = new THREE.BufferGeometry(); gEst.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  escena.add(new THREE.Points(gEst, new THREE.PointsMaterial({ color: 0xfff0d0, size: 0.7, fog: false, transparent: true, opacity: .8 })));
  // Luna enorme y enfermiza
  const luna = new THREE.Mesh(new THREE.CircleGeometry(9, 40), new THREE.MeshBasicMaterial({ color: 0xe8d2a0, fog: false }));
  luna.position.set(-60, 55, -120); luna.lookAt(0, 0, 0); escena.add(luna);
}

// ---------- Luces ----------
escena.add(new THREE.HemisphereLight(0x7a7aaa, 0x3a2414, 1.5));
const lunaLuz = new THREE.DirectionalLight(0x9aa0d0, 0.9); lunaLuz.position.set(-30, 40, -20); escena.add(lunaLuz);

// ---------- Texturas pintadas a mano en canvas ----------
function textura(w, h, pintar, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  pintar(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); }
  t.anisotropy = 4;
  return t;
}
const texTablas = textura(256, 256, (g, w, h) => {
  g.fillStyle = '#5a3a22'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 8; i++) {
    const y = i * 32;
    g.fillStyle = `hsl(25, ${30 + Math.random() * 15}%, ${20 + Math.random() * 10}%)`; g.fillRect(0, y + 1, w, 30);
    g.strokeStyle = 'rgba(0,0,0,.25)';
    for (let k = 0; k < 6; k++) { g.beginPath(); g.moveTo(0, y + 4 + Math.random() * 24); g.bezierCurveTo(80, y + Math.random() * 30, 160, y + Math.random() * 30, w, y + 4 + Math.random() * 24); g.stroke(); }
    g.fillStyle = '#140a04'; g.fillRect(0, y, w, 2);
    const corte = (i * 97) % w; g.fillRect(corte, y, 2, 32);
    g.fillStyle = '#2a1a10'; g.beginPath(); g.arc(corte + 6, y + 8, 1.6, 0, 7); g.arc(corte + 6, y + 24, 1.6, 0, 7); g.fill();
  }
}, [6, 6]);
const texLona = textura(256, 256, (g, w, h) => {
  g.fillStyle = '#3a3036'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '120,100,90'},.08)`; g.fillRect(Math.random() * w, Math.random() * h, 3, 1); }
  // Parches cosidos
  for (let i = 0; i < 5; i++) {
    const x = Math.random() * w, y = Math.random() * h, s = 30 + Math.random() * 40;
    g.fillStyle = ['#4a3428', '#2e2a30', '#54402e'][i % 3]; g.fillRect(x, y, s, s * .7);
    g.strokeStyle = '#c9b48a'; g.setLineDash([3, 4]); g.lineWidth = 1.2; g.strokeRect(x + 3, y + 3, s - 6, s * .7 - 6); g.setLineDash([]);
  }
  g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 3;
  for (let x = 0; x < w; x += 64) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
}, [6, 2]);
const texTela = textura(128, 128, (g, w, h) => {
  g.fillStyle = '#6a2a1c'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#8a3a24'; for (let x = 0; x < w; x += 32) g.fillRect(x, 0, 16, h);
  for (let i = 0; i < 300; i++) { g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
});

const mat = {
  tabla: new THREE.MeshStandardMaterial({ map: texTablas, roughness: .9 }),
  madera: new THREE.MeshStandardMaterial({ color: 0x4a2e1a, roughness: .85 }),
  oscura: new THREE.MeshStandardMaterial({ color: 0x241810, roughness: .9 }),
  lona: new THREE.MeshStandardMaterial({ map: texLona, roughness: 1 }),
  hierro: new THREE.MeshStandardMaterial({ color: 0x3a3a40, roughness: .5, metalness: .7 }),
  laton: new THREE.MeshStandardMaterial({ color: 0xa07a3a, roughness: .4, metalness: .8 }),
  tela: new THREE.MeshStandardMaterial({ map: texTela, roughness: 1, side: THREE.DoubleSide }),
  piedra: new THREE.MeshStandardMaterial({ color: 0x5a524a, roughness: 1 }),
  hueso: new THREE.MeshStandardMaterial({ color: 0xd8ccb0, roughness: .8 }),
  cuerda: new THREE.LineBasicMaterial({ color: 0x5a4a38, transparent: true, opacity: .5 })
};
const caja = (w, h, d, m, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); return o; };
const cil = (r1, r2, h, m, x, y, z, seg = 10) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), m); o.position.set(x, y, z); return o; };

// =============================================================
//  El barco. Todo cuelga de "barco" para que se balancee junto.
// =============================================================
const barco = new THREE.Group(); escena.add(barco);
const LARGO = 15, ANCHO = 5.6;               // semiejes de la cubierta (elipse)
const dentro = (x, z, m = 0) => (x * x) / ((LARGO - m) ** 2) + (z * z) / ((ANCHO - m) ** 2) < 1;

// Cubierta: elipse alargada, con borde de proa en punta
const forma = new THREE.Shape();
forma.moveTo(-LARGO - 1.5, 0);
forma.bezierCurveTo(-LARGO, ANCHO * 1.05, -LARGO * .4, ANCHO * 1.15, 0, ANCHO * 1.12);
forma.bezierCurveTo(LARGO * .5, ANCHO * 1.12, LARGO, ANCHO * .95, LARGO + 2.5, 0);
forma.bezierCurveTo(LARGO, -ANCHO * .95, LARGO * .5, -ANCHO * 1.12, 0, -ANCHO * 1.12);
forma.bezierCurveTo(-LARGO * .4, -ANCHO * 1.15, -LARGO, -ANCHO * 1.05, -LARGO - 1.5, 0);
const cubierta = new THREE.Mesh(new THREE.ExtrudeGeometry(forma, { depth: .5, bevelEnabled: false, curveSegments: 24 }), mat.tabla);
cubierta.rotation.x = -Math.PI / 2; cubierta.position.y = -.5;
// UV de las tablas en coordenadas de mundo
{ const uv = cubierta.geometry.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 6, uv.getY(i) / 6); }
barco.add(cubierta);
// Casco bajo la cubierta
const casco = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), mat.madera);
casco.scale.set(LARGO + 1.5, 4.2, ANCHO + .9); casco.position.y = -.5; barco.add(casco);
// Barandilla
{
  const puntos = forma.getSpacedPoints(70);
  const g = new THREE.Group();
  const pts = [];
  puntos.forEach((p, i) => {
    const x = p.x * .97, z = -p.y * .97;
    if (i % 2 === 0) g.add(cil(.06, .07, 1, mat.oscura, x, .5, z, 5));
    pts.push(new THREE.Vector3(x, 1, z));
  });
  const tubo = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 140, .07, 5, true), mat.madera);
  g.add(tubo);
  barco.add(g);
}

// Globo: una envoltura enorme de lona remendada
const globo = new THREE.Group(); globo.position.y = 17; barco.add(globo);
{
  const env = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 20), mat.lona);
  env.scale.set(21, 6.4, 7.4); globo.add(env);
  for (let i = -4; i <= 4; i++) {               // costillas de latón
    const x = i * 4.4, f = Math.sqrt(1 - (x / 21) ** 2);
    const r = new THREE.Mesh(new THREE.TorusGeometry(1, .02, 5, 40), mat.laton);
    r.scale.set(7.45 * f, 6.45 * f, 1); r.rotation.y = Math.PI / 2; r.position.x = x; globo.add(r);
  }
  // Aletas de cola
  for (const [rx, ry] of [[0, 0], [Math.PI / 2, 0]]) {
    const a = new THREE.Mesh(new THREE.ConeGeometry(4, 6, 3), mat.tela); a.scale.set(.15, 1, 1);
    a.rotation.set(rx, 0, Math.PI / 2); a.position.x = -21; globo.add(a);
  }
}
// Cuerdas del globo a la cubierta
{
  const verts = [];
  for (let i = 0; i < 7; i++) {
    const t = i / 6, x = -LARGO + 1 + t * (LARGO * 2 - 2);
    for (const s of [-1, 1]) {
      const z = s * ANCHO * Math.sqrt(Math.max(0, 1 - (x / LARGO) ** 2)) * .95;
      verts.push(x, 1, z, x * .9, 11.5, s * 5.4 * Math.sqrt(Math.max(0, 1 - (x / 21) ** 2)));
    }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  barco.add(new THREE.LineSegments(g, mat.cuerda));
}
// Hélice de popa
const helice = new THREE.Group(); helice.position.set(-LARGO - 2.6, 2.2, 0); barco.add(helice);
{
  barco.add(caja(2.4, .3, .3, mat.hierro, -LARGO - 1.4, 2.2, 0));
  for (let i = 0; i < 4; i++) { const p = caja(.12, 3.2, .45, mat.madera, 0, 0, 0); p.rotation.x = i * Math.PI / 2; p.geometry.translate(0, 1.6, 0); helice.add(p); }
  helice.add(cil(.3, .3, .5, mat.laton, 0, 0, 0)); helice.children.at(-1).rotation.z = Math.PI / 2;
}
// Mástil de proa con un mascarón de calavera
{
  barco.add(cil(.12, .16, 4, mat.madera, LARGO + 1, 1.6, 0, 6));
  const cal = new THREE.Mesh(new THREE.SphereGeometry(.45, 12, 10), mat.hueso); cal.position.set(LARGO + 2.4, .3, 0); cal.scale.set(1, .9, .85); barco.add(cal);
}

// Farolillos: varios con brillo, pero solo unos pocos con luz real
const llamas = [];
function farol(x, z, luz) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  g.add(cil(.06, .08, 2.6, mat.oscura, 0, 1.3, 0, 5));
  g.add(caja(.6, .06, .06, mat.oscura, .3, 2.55, 0));
  const vidrio = new THREE.Mesh(new THREE.SphereGeometry(.2, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffb050 }));
  vidrio.position.set(.55, 2.25, 0); g.add(vidrio);
  g.add(caja(.36, .05, .36, mat.hierro, .55, 2.48, 0));
  let l = null;
  if (luz) { l = new THREE.PointLight(0xff9a40, 16, 15, 1.5); l.position.copy(vidrio.position); g.add(l); }
  llamas.push({ vidrio, l, fase: Math.random() * 10 });
  barco.add(g);
  return g;
}

// ---------- Zonas del pueblo ----------
const colisiones = [];   // círculos {x, z, r}
const tope = (x, z, r) => colisiones.push({ x, z, r });

// Puesto de Mordo (izquierda, al fondo)
function puestoMordo(x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  g.add(caja(3.4, .9, 1.2, mat.madera, 0, .45, 0));
  for (const [px, pz] of [[-1.6, -.5], [1.6, -.5], [-1.6, .5], [1.6, .5]]) g.add(cil(.07, .07, 2.6, mat.oscura, px, 1.3, pz, 5));
  const toldo = new THREE.Mesh(new THREE.PlaneGeometry(3.9, 1.9, 6, 2), mat.tela);
  { const p = toldo.geometry.attributes.position; for (let i = 0; i < p.count; i++) if (p.getY(i) < 0) p.setZ(i, (Math.random() - .5) * .15); }
  toldo.rotation.x = -Math.PI / 2 + .35; toldo.position.set(0, 2.65, .1); g.add(toldo);
  for (let i = 0; i < 4; i++) {                 // calaveras y frascos a la venta
    const c = new THREE.Mesh(new THREE.SphereGeometry(.16, 8, 6), mat.hueso); c.position.set(-1.2 + i * .35, 1.05, .3); g.add(c);
  }
  for (let i = 0; i < 5; i++) {
    const f = cil(.08, .1, .3, new THREE.MeshStandardMaterial({ color: [0x7a1a12, 0x2a6a3a, 0x3a3a8a][i % 3], emissive: [0x5a0a06, 0x0a3a1a, 0x101050][i % 3], roughness: .2 }), .3 + i * .25, 1.05, .1);
    g.add(f);
  }
  for (let i = 0; i < 3; i++) { const cu = cil(.02, .02, .7, mat.cuerda, -1.4 + i * 1.2, 2.2, .55, 3); g.add(cu); const cc = new THREE.Mesh(new THREE.SphereGeometry(.13, 7, 5), mat.hueso); cc.position.set(-1.4 + i * 1.2, 1.8, .55); g.add(cc); }
  barco.add(g); tope(x, z, 2);
}
// La Hiel: casita de banca torcida
function casaHiel(x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = -.15;
  g.add(caja(3.6, 2.8, 2.6, mat.piedra, 0, 1.4, 0));
  const tejado = new THREE.Mesh(new THREE.ConeGeometry(2.9, 1.8, 4), mat.oscura); tejado.rotation.y = Math.PI / 4; tejado.scale.set(1.05, 1, .75); tejado.position.y = 3.7; g.add(tejado);
  g.add(caja(.9, 1.6, .1, mat.oscura, -.6, .8, 1.32));
  const ventana = caja(.6, .5, .1, new THREE.MeshBasicMaterial({ color: 0xffb860 }), .9, 1.7, 1.32); g.add(ventana);
  const cartel = new THREE.Mesh(new THREE.PlaneGeometry(1.8, .45), new THREE.MeshStandardMaterial({ map: textura(256, 64, (c) => {
    c.fillStyle = '#c9b48a'; c.fillRect(0, 0, 256, 64); c.strokeStyle = '#1c120b'; c.lineWidth = 4; c.strokeRect(2, 2, 252, 60);
    c.fillStyle = '#1c120b'; c.font = '34px "IM Fell English SC", serif'; c.textAlign = 'center'; c.fillText('LA HIEL', 128, 44);
  }) }));
  cartel.position.set(0, 2.55, 1.36); g.add(cartel);
  g.add(cil(.25, .25, 1.6, mat.piedra, 1.4, 4.2, -.6, 6));    // chimenea
  barco.add(g); tope(x, z, 2.3);
}
// La forja fría: tapada con lona y encadenada
function forjaFria(x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = .3;
  g.add(caja(3, 2.2, 2.4, mat.piedra, 0, 1.1, 0));
  g.add(cil(.45, .55, 3, mat.piedra, .9, 3.3, -.5, 8));
  const lona = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x3a3228, roughness: 1, flatShading: true }));
  lona.scale.set(2.1, 2.6, 1.8); lona.position.y = .2; g.add(lona);

// =============================================================
//  Bucle
// =============================================================
let cerca = null;
const reloj = new THREE.Clock();
const camPos = new THREE.Vector3(), camMira = new THREE.Vector3();
let primera = true, tAndar = 0;
// Medidor de fluidez: si va a tirones, ofrece la vista de libro
let cuadros = 0, tMedida = 0, lentos = 0, avisado = false;

function bucle() {
  const real = reloj.getDelta(), dt = Math.min(real, .05), t = reloj.elapsedTime;

  // Balanceo suave del zepelín
  barco.rotation.z = Math.sin(t * .5) * .012;
  barco.rotation.x = Math.sin(t * .37) * .01;
  barco.position.y = Math.sin(t * .6) * .15;
  helice.rotation.x += dt * 6;

  // Movimiento del héroe
  let dx = 0, dz = 0;
  if (!enDialogo) {
    if (teclas.has('w') || teclas.has('arrowup')) dz -= 1;
    if (teclas.has('s') || teclas.has('arrowdown')) dz += 1;
    if (teclas.has('a') || teclas.has('arrowleft')) dx -= 1;
    if (teclas.has('d') || teclas.has('arrowright')) dx += 1;
    if (porHablar && Math.hypot(heroe.position.x - porHablar.x, heroe.position.z - porHablar.z) < porHablar.radio * .8) interactuar(porHablar);
    if (!dx && !dz && destino) {
      const vx = destino.x - heroe.position.x, vz = destino.z - heroe.position.z, d = Math.hypot(vx, vz);
      if (d < .25) { destino = null; if (porHablar) interactuar(porHablar); }
      else { dx = vx / d; dz = vz / d; }
    }
  }
  const mov = Math.hypot(dx, dz);
  if (mov) {
    const v = 5.2 * dt / mov;
    const nx = heroe.position.x + dx * v, nz = heroe.position.z + dz * v;
    if (libre(nx, nz)) heroe.position.set(nx, 0, nz);
    else if (libre(nx, heroe.position.z)) heroe.position.x = nx;
    else if (libre(heroe.position.x, nz)) heroe.position.z = nz;
    else if (destino) { destino = null; if (porHablar && Math.hypot(heroe.position.x - porHablar.x, heroe.position.z - porHablar.z) < porHablar.radio) interactuar(porHablar); }
    if (dx) planoHeroe.scale.x = dx < 0 ? -1 : 1;
    tAndar += dt * 11;
  } else tAndar = 0;
  // Pasito de figura de papel: salta y se ladea
  planoHeroe.position.y = 1.1 + Math.abs(Math.sin(tAndar)) * .18;
  planoHeroe.rotation.z = Math.sin(tAndar) * .07;
  sombra.scale.setScalar(1 - Math.abs(Math.sin(tAndar)) * .15);

  // PNJ: respiran un poco
  for (const p of PNJ) if (p.fig) p.fig.userData.plano.scale.y = 1 + Math.sin(t * 1.6 + p.x) * .012;

  // ¿Hay alguien cerca?
  cerca = null;
  for (const p of PNJ) if (Math.hypot(heroe.position.x - p.x, heroe.position.z - p.z) < p.radio) cerca = p;
  const ba = $('accion');
  if (cerca && !enDialogo) { ba.style.display = 'block'; ba.innerHTML = `${cerca.accion || 'Hablar con ' + cerca.nombre.split(' ')[0]}${movil ? '' : '<kbd>E</kbd>'}`; }
  else ba.style.display = 'none';

  // Farolillos que tiemblan
  for (const f of llamas) {
    const k = .85 + Math.sin(t * 9 + f.fase) * .08 + Math.sin(t * 23 + f.fase) * .05;
    f.vidrio.scale.setScalar(k);
    if (f.l) f.l.intensity = 16 * k;
  }
  luzLibro.intensity = 7 + Math.sin(t * 2) * 2;
  // Motas del libro
  const pos = motas.p.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let y = pos.getY(i) + dt * (.4 + motas.vel[i] * .6);
    if (y > 5) { y = 1.6; }
    const s = (y - 1.6) * .35;
    pos.setXYZ(i, 1 + Math.sin(t + i) * s, y, .5 + Math.cos(t * .8 + i * 2) * s);
  }
  pos.needsUpdate = true;
  motas.p.material.opacity = .9;

  // Cámara: detrás y arriba, siguiendo con suavidad
  const objetivo = heroe.getWorldPosition(new THREE.Vector3());
  const deseada = objetivo.clone().add(DESFASE_CAM);
  if (primera) { camPos.copy(deseada).add(new THREE.Vector3(-14, 10, 10)); camMira.copy(objetivo); primera = false; }
  camPos.lerp(deseada, 1 - Math.pow(.02, dt));
  camMira.lerp(objetivo.clone().add(MIRA_ADELANTE), 1 - Math.pow(.01, dt));
  camara.position.copy(camPos); camara.lookAt(camMira);

  // Rótulos sobre las cabezas
  for (const p of PNJ) {
    const alto = p.fig ? 3 : p.id === 'libro' ? 2.6 : 3.8;
    const w = barco.localToWorld(new THREE.Vector3(p.x, alto, p.z)).project(camara);
    const visible = w.z < 1 && (cerca === p || Math.hypot(heroe.position.x - p.x, heroe.position.z - p.z) < 7);
    p.rotulo.style.left = ((w.x + 1) / 2 * innerWidth) + 'px';
    p.rotulo.style.top = ((1 - w.y) / 2 * innerHeight) + 'px';
    p.rotulo.style.opacity = visible ? 1 : 0;
  }

  render.render(escena, camara);

  // Fluidez
  cuadros++; tMedida += real;
  if (tMedida >= 1) {
    const fps = cuadros / tMedida; $('fps').textContent = Math.round(fps) + ' fps';
    if (fps < 24 && t > 4) lentos++; else lentos = 0;
    if (lentos === 2 && escalaPixel > .8) { escalaPixel = Math.max(.75, escalaPixel - .35); render.setPixelRatio(escalaPixel); }  // primero baja la resolución
    if (lentos >= 5 && !avisado) {
      avisado = true;
      const av = $('aviso');
      av.innerHTML = 'Esto va a tirones en este dispositivo.<br><button class="btn" id="av-libro">Ver la base como libro</button><button class="btn" id="av-no">Seguir aquí</button>';
      av.style.display = 'block';
      $('av-libro').onclick = () => $('b-libro').click();
      $('av-no').onclick = () => { av.style.display = 'none'; };
    }
    cuadros = 0; tMedida = 0;
  }
  requestAnimationFrame(bucle);
}
addEventListener('resize', () => { camara.aspect = innerWidth / innerHeight; camara.updateProjectionMatrix(); render.setSize(innerWidth, innerHeight); });
if (innerWidth < innerHeight) { DESFASE_CAM.set(0, 9.5, 12); MIRA_ADELANTE.set(0, 1.2, -3.5); camara.fov = 62; camara.updateProjectionMatrix(); }   // en vertical, más alejada
requestAnimationFrame(bucle);
setTimeout(() => { $('fundido').style.opacity = 0; }, 150);
</script>

<script>
// Pantalla completa (en iPhone Safari no existe: el botón se oculta)
(() => {
  const b = document.getElementById('b-completa'); if (!b) return;
  const el = document.documentElement;
  const pedir = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!pedir) { b.style.display = 'none'; return; }
  const activa = () => document.fullscreenElement || document.webkitFullscreenElement;
  const pintar = () => { b.textContent = activa() ? '⤡' : '⛶'; b.title = activa() ? 'Salir de pantalla completa' : 'Pantalla completa'; };
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    if (activa()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = pedir.call(el); if (r && r.catch) r.catch(() => {}); if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }
  });
  document.addEventListener('fullscreenchange', pintar); document.addEventListener('webkitfullscreenchange', pintar);
  pintar();
})();
</script>
