<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1626; font-family: Nunito, system-ui, sans-serif; color: #3a2a20; touch-action: manipulation; }
  #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .caja { background: #fff8e6; border-radius: 18px; box-shadow: 0 8px 24px #0006; }
  #panel { position: fixed; left: 12px; top: 12px; bottom: 12px; width: min(440px, calc(100% - 24px)); overflow-y: auto; padding: 16px 18px; box-sizing: border-box; z-index: 5; overscroll-behavior: contain; }
  @media (max-width: 760px) { #panel { top: auto; max-height: 62%; left: 8px; right: 8px; bottom: 8px; width: auto; } }
  #panel h2 { margin: 0 0 6px; color: #8a1c1c; font-weight: 900; } #panel h2 small { display: block; font-size: 13px; color: #6a5a4a; font-weight: 700; }
  #panel p { margin: 6px 0 10px; font-weight: 600; line-height: 1.4; } .nota { font-size: 13px; opacity: .8; }
  .cartas, .liga { display: grid; gap: 8px; } .cartas { grid-template-columns: 1fr 1fr; }
  .cartas button, .liga button { text-align: left; border: 0; border-radius: 14px; background: #fff0cc; padding: 10px 12px; font: inherit; cursor: pointer; box-shadow: 0 3px 0 #e2c88a; }
  .cartas button span, .liga button span { font-size: 28px; float: left; margin-right: 8px; } .cartas b, .liga b { display: block; } .cartas small, .liga small { display: block; font-size: 12px; opacity: .8; font-weight: 600; }
  .liga button:disabled { opacity: .5; cursor: default; }
  .hueco { margin: 10px 0; } .hueco > b { font-size: 14px; } .piezas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .piezas button { border: 2px solid transparent; border-radius: 12px; background: #fff0cc; padding: 6px 10px; font: inherit; font-weight: 800; font-size: 13px; cursor: pointer; text-align: left; }
  .piezas button small { display: block; font-weight: 600; font-size: 11px; opacity: .8; } .piezas button.puesta { border-color: #c9a24a; background: #ffe6a8; }
  .fila-botones { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .fila-botones button, .boton { border: 0; border-radius: 14px; background: #f0e2c0; padding: 10px 14px; font: inherit; font-weight: 900; cursor: pointer; box-shadow: 0 3px 0 #d8c08a; color: #3a2a20; text-decoration: none; }
  .fila-botones .grande { background: #ffcf4a; box-shadow: 0 3px 0 #c8962a; flex: 1; }
  #barras { position: fixed; left: 8px; right: 8px; top: max(8px, env(safe-area-inset-top)); display: flex; justify-content: space-between; gap: 8px; z-index: 4; pointer-events: none; }
  #barras > div { padding: 8px 10px; width: min(220px, 46%); box-sizing: border-box; font-size: 13px; }
  .barra { display: grid; grid-template-columns: 22px 1fr 22px; align-items: center; gap: 4px; margin-top: 3px; }
  .barra i { height: 9px; border-radius: 6px; background: linear-gradient(90deg, #5ac85a var(--p), #e8dcc0 var(--p)); }
  .barra.rota { opacity: .45; } .barra em { font-style: normal; font-weight: 900; text-align: right; }
  #narrar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); background: #2a1e2ae6; color: #fff8e6; padding: 10px 16px; border-radius: 14px; font-weight: 800; text-align: center; width: min(560px, calc(100% - 24px)); box-sizing: border-box; z-index: 4; }
  #botones { position: fixed; left: 8px; right: 8px; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; z-index: 4; }
  #botones button { border: 0; border-radius: 14px; background: #fff8e6; padding: 10px 12px; font: inherit; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 4px 0 #c8a86a; min-width: 96px; }
  #botones button span { display: block; font-size: 20px; } #botones button:disabled { opacity: .5; }
  #volver { position: fixed; right: 10px; top: max(10px, env(safe-area-inset-top)); z-index: 6; }
  #barras:not([hidden]) ~ #volver { top: auto; bottom: 170px; }
