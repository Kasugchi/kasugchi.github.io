<body>
<div id="fundido"></div>
<main>
  <h1>La sala</h1>
  <p class="sub">Ya estás dentro. ¿Dónde esperas a los demás? Desde cualquier sitio podéis hablar y bajar juntos al libro.</p>
  <div class="eleccion">
    <button id="elige-pueblo"><span class="ico">🏘</span><b>El pueblo</b><small>Vuestras casas y los vecinos</small></button>
    <button id="elige-claro"><span class="ico">🌲</span><b>La aventura</b><small>Bajar al claro con tu héroe</small></button>
    <button id="elige-aqui" class="aqui"><span class="ico">⚔</span><b>Esperar aquí</b><small>Sin 3D, listos para la mazmorra</small></button>
  </div>
  <div class="eleccion" id="con-ellos" hidden></div>
  <div id="sala"></div>
  <nav><a href="index.html">← Menú del juego</a></nav>
</main>
<script type="module">
import './js/acceso.js';
import { crearPanel } from './js/reunion.js';
import * as Ficha from './js/viajero.js';
const leer = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const ficha = Ficha.fichaOCrear(leer('criptas_nombre', '') || 'Viajero');
const panel = crearPanel({
  donde: 'ligera', fijo: document.getElementById('sala'),
  datos: () => ({ clase: ficha.heroes[ficha.activo]?.tipo || leer('criptas_claseBase', 'barbaro'), caidos: ficha.orden.filter((id) => ficha.heroes[id]?.caido).length }),
  cabana: () => ({ nombre: ficha.nombre, trofeos: ficha.cabana.trofeos.slice(-12), diario: ficha.diario }),
  irA: (url) => { document.getElementById('fundido').style.opacity = 1; setTimeout(() => { location.href = url; }, 700); }
});
// Elegir dónde esperar: el pueblo, la aventura, con alguien de la sala o aquí mismo (la sala va contigo)
const ir = (pagina) => { const c = panel.R?.codigo || new URLSearchParams(location.search).get('sala') || '';
  document.getElementById('fundido').style.opacity = 1; setTimeout(() => { location.href = pagina + (c ? (pagina.includes('?') ? '&' : '?') + 'sala=' + c : ''); }, 700); };
// «Ir con…»: un botón por cada uno de la sala que está en un sitio al que se puede ir (pueblo, una parada, una cripta)
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function destino(g) {
  if (g.donde === 'pueblo') return { url: 'pueblo.html', ico: '🏘', sitio: 'en el pueblo' };
  if (String(g.donde || '').startsWith('aventura-')) return { url: 'claro.html?p=' + g.donde.slice(9), ico: '🌲', sitio: 'de aventura' };
  if (g.donde === 'cripta') { let b = null; try { b = JSON.parse(g.baja || 'null'); } catch { /* sin invitación */ } if (b?.url) return { url: b.url, ico: '💀', sitio: 'en una cripta' }; }
  return null;
}
function pintarConEllos(gente) {
  const caja = document.getElementById('con-ellos'), yo = panel.R?.yo.id;
  const lista = Object.entries(gente || {}).filter(([id, g]) => id !== yo && g.online !== false).map(([, g]) => [g, destino(g)]).filter(([, d]) => d);
  caja.hidden = !lista.length;
  caja.innerHTML = lista.map(([g, d], i) => `<button data-i="${i}"><span class="ico">${d.ico}</span><b>Ir con ${esc(g.nombre)}</b><small>Está ${d.sitio}</small></button>`).join('');
  caja.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => ir(lista[+b.dataset.i][1].url)));
}
panel.listo.then(() => { const R = panel.R; if (!R) return; R.on('gente', pintarConEllos); pintarConEllos(R.gente()); }).catch(() => {});
document.getElementById('elige-claro').addEventListener('click', () => ir('claro.html'));
document.getElementById('elige-pueblo').addEventListener('click', () => ir('pueblo.html'));
document.getElementById('elige-aqui').addEventListener('click', () => document.querySelector('.reu-panel .chat-in')?.focus());
</script>
