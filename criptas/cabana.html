<script type="module">
import './js/acceso.js';
import * as THREE from 'three';
import { EffectComposer } from './js/vendor/addons/postprocessing/EffectComposer.js';
import { RenderPass } from './js/vendor/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './js/vendor/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './js/vendor/addons/postprocessing/OutputPass.js';
import { crearMezclador } from './js/mezclador.js';
import * as Ficha from './js/viajero.js';
// Lo que cambies aquí (banco, obras, encargos, nombres, héroe activo) sube a tu cuenta enseguida.
import('./js/nube.js').then(async (m) => {
  const u = await m.usuarioListo(); if (!u) return;
  // Primero se junta con lo que haya en la nube (por si jugaste en otro dispositivo), y luego se sube.
  const enNube = await m.leerFichaNube();
  if (enNube) { ficha = Ficha.fusionar(ficha, enNube); Ficha.guardarFicha(ficha); }
  Ficha.subirAlGuardar((f) => m.subirFicha(f));
  m.subirFicha(ficha);
}).catch(() => {});
import { crearPanel, cabanaDeLaSala, FRASES, GESTOS } from './js/reunion.js';

// =============================================================
//  Prototipo: la cabaña del jugador por dentro.
//  Vista de casa de muñecas: la pared que mira a la cámara se
//  desvanece. Trofeos, baúl de héroes, hamaca, chimenea, ventana
//  al mar de tinta, escritorio con el diario y armero.
// =============================================================
const $ = (id) => document.getElementById(id);
const leer = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const azar = (a, b) => a + Math.random() * (b - a);
const uno = (l) => l[Math.floor(Math.random() * l.length)];
const suave = (a, b, k) => a + (b - a) * k;
const movil = matchMedia('(pointer: coarse)').matches;
const prm = new URLSearchParams(location.search);
const embebida = prm.has('embebida') && window.parent !== window;   // abierta encima de la tortuga
// Tu ficha de viajero (la guarda el juego en este dispositivo).
let ficha = Ficha.fichaOCrear(leer('criptas_nombre') || 'Viajero');
const guardarF = () => Ficha.guardarFicha(ficha);
// De visita en la sala de otro: su muro de trofeos y su diario (tu baúl sigue siendo tuyo).
const visita = await cabanaDeLaSala();
const dueno = visita || { nombre: ficha.nombre, trofeos: ficha.cabana.trofeos, diario: ficha.diario };
if (visita) { document.title = 'Criptas · Cabaña de ' + visita.nombre; $('titulo').firstChild.textContent = 'Cabaña de ' + visita.nombre + ' '; }
const CALIDADES = ['baja', 'media', 'alta'];
let calidad = prm.get('calidad') || leer('criptas_calidadTortuga', movil ? 'media' : 'alta');
if (!CALIDADES.includes(calidad)) calidad = 'media';

const render = new THREE.WebGLRenderer({ antialias: !movil, powerPreference: 'high-performance' });
render.outputColorSpace = THREE.SRGBColorSpace;
render.toneMapping = THREE.ACESFilmicToneMapping;
render.toneMappingExposure = 1.1;
document.body.appendChild(render.domElement);
const escena = new THREE.Scene();
escena.background = new THREE.Color(0x0e0806);
const camara = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, .3, 200);
const composer = new EffectComposer(render);
composer.addPass(new RenderPass(escena, camara));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .55, .5, .82);
composer.addPass(bloom);
composer.addPass(new OutputPass());
function aplicarCalidad() {
  const pr = Math.min(devicePixelRatio, calidad === 'alta' ? 1.75 : calidad === 'media' ? 1.25 : 1);
  render.setPixelRatio(pr); composer.setPixelRatio(pr);
  render.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  $('b-calidad').textContent = 'Calidad: ' + calidad;
}

function textura(w, h, pintar, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  pintar(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); }
  t.anisotropy = 8;
  return t;
}
const caja = (w, h, d, m, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); return o; };
const cil = (r1, r2, h, m, x, y, z, seg = 12) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), m); o.position.set(x, y, z); return o; };
const brillo = (r, g, b) => new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b) });
const en = (o, x, y, z) => { o.position.set(x, y, z); return o; };

// ---------- Texturas ----------
const texTablas = textura(256, 256, (g, w) => {
  g.fillStyle = '#4a2e1a'; g.fillRect(0, 0, w, w);
  for (let i = 0; i < 8; i++) {
    const y = i * 32;
    g.fillStyle = `hsl(26, ${34 + Math.random() * 12}%, ${26 + Math.random() * 9}%)`; g.fillRect(0, y + 1, w, 30);
    g.strokeStyle = 'rgba(0,0,0,.22)';
    for (let k = 0; k < 6; k++) { g.beginPath(); g.moveTo(0, y + 4 + Math.random() * 24); g.bezierCurveTo(80, y + Math.random() * 30, 160, y + Math.random() * 30, w, y + 4 + Math.random() * 24); g.stroke(); }
    g.fillStyle = '#1a0e06'; g.fillRect(0, y, w, 2);
    const corte = (i * 97) % w; g.fillRect(corte, y, 2, 32);
  }
}, [1, 1]);
const texYeso = textura(256, 256, (g, w) => {
  g.fillStyle = '#c8b494'; g.fillRect(0, 0, w, w);
  for (let k = 0; k < 2500; k++) { g.fillStyle = `rgba(${Math.random() < .5 ? '90,70,50' : '255,245,225'},.06)`; g.fillRect(Math.random() * w, Math.random() * w, 3, 3); }
  for (let k = 0; k < 8; k++) { g.fillStyle = 'rgba(80,60,40,.12)'; g.beginPath(); g.ellipse(Math.random() * w, Math.random() * w, 20 + Math.random() * 40, 10 + Math.random() * 30, 0, 0, 7); g.fill(); }
}, [2, 1]);
const texAlfombra = textura(512, 512, (g, w) => {
  const c = w / 2;
  const anillos = ['#6a1e1a', '#c88a3a', '#3a2a5a', '#a8402a', '#e0b860', '#2a4a4a', '#6a1e1a'];
  anillos.forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.arc(c, c, c - i * 34, 0, 7); g.fill(); });
  g.strokeStyle = 'rgba(240,210,150,.7)'; g.lineWidth = 4;
  for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8; g.beginPath(); g.moveTo(c + Math.cos(a) * 70, c + Math.sin(a) * 70); g.lineTo(c + Math.cos(a) * 200, c + Math.sin(a) * 200); g.stroke(); }
  g.fillStyle = '#e0b860'; g.beginPath(); g.arc(c, c, 46, 0, 7); g.fill();
  g.fillStyle = '#6a1e1a'; g.font = 'bold 56px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('✠', c, c + 4);
  for (let k = 0; k < 3000; k++) { g.fillStyle = 'rgba(0,0,0,.06)'; g.fillRect(Math.random() * w, Math.random() * w, 2, 2); }
});
const texLibros = textura(256, 128, (g, w, h) => {
  g.fillStyle = '#2a1a10'; g.fillRect(0, 0, w, h);
  for (const fila of [0, 64]) { let x = 4; while (x < w - 8) { const ancho = 8 + Math.random() * 12, alto = 40 + Math.random() * 18; g.fillStyle = uno(['#7a1f1a', '#2f4f7a', '#3d6b3a', '#7a6420', '#5a2f6a', '#8a4a20', '#3a3a3a']); g.fillRect(x, fila + 60 - alto, ancho, alto); g.fillStyle = 'rgba(230,200,120,.5)'; g.fillRect(x + 2, fila + 66 - alto, ancho - 4, 2); x += ancho + 1; } }
});
const texVentana = textura(256, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2a1240'); gr.addColorStop(.45, '#c85a4a'); gr.addColorStop(.58, '#ffb070'); gr.addColorStop(.6, '#3a1a3a'); gr.addColorStop(1, '#120818');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff2c8'; g.beginPath(); g.arc(w * .62, h * .58, 16, Math.PI, 0); g.fill();
  g.fillStyle = 'rgba(255,200,130,.6)'; for (let i = 0; i < 14; i++) g.fillRect(w * .62 - 30 + Math.random() * 60, h * (.62 + i * .025), 10 + Math.random() * 30, 2);
  g.fillStyle = 'rgba(30,10,30,.9)'; g.beginPath(); g.moveTo(0, h * .6); g.lineTo(w * .2, h * .52); g.lineTo(w * .32, h * .6); g.fill();
});
const mat = {
  tablas: new THREE.MeshStandardMaterial({ map: texTablas, roughness: .85 }),
  madera: new THREE.MeshStandardMaterial({ color: 0x5a3820, roughness: .8 }),
  oscura: new THREE.MeshStandardMaterial({ color: 0x2a1810, roughness: .85 }),
  piedra: new THREE.MeshStandardMaterial({ color: 0x6a5e54, roughness: 1 }),
  hierro: new THREE.MeshStandardMaterial({ color: 0x3a3a40, roughness: .45, metalness: .75 }),
  laton: new THREE.MeshStandardMaterial({ color: 0xc09048, roughness: .35, metalness: .85 }),
  hueso: new THREE.MeshStandardMaterial({ color: 0xe6d8bc, roughness: .7 }),
  tela: new THREE.MeshStandardMaterial({ color: 0x8a3a2a, roughness: 1, side: THREE.DoubleSide }),
  lona: new THREE.MeshStandardMaterial({ color: 0xc8b088, roughness: 1, side: THREE.DoubleSide }),
  vela: new THREE.MeshStandardMaterial({ color: 0xf0e2c0, roughness: .6 }),
  vidrio: new THREE.MeshStandardMaterial({ color: 0xa8c8d8, roughness: .05, metalness: .1, transparent: true, opacity: .18 })
};

// =============================================================
//  La sala redonda
// =============================================================
const R = 6.2, ALTO = 3.6;
const casa = new THREE.Group(); escena.add(casa);
const suelo = new THREE.Mesh(new THREE.CircleGeometry(R + .1, 48), mat.tablas); suelo.rotation.x = -Math.PI / 2;
{ const p = suelo.geometry.attributes.position, uv = suelo.geometry.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, p.getX(i) / 4, p.getY(i) / 4); }
casa.add(suelo);
const zocalo = new THREE.Mesh(new THREE.CylinderGeometry(R + .6, R + .9, .5, 48), mat.piedra); zocalo.position.y = -.26; casa.add(zocalo);
const alfombra = new THREE.Mesh(new THREE.CircleGeometry(2.3, 48), new THREE.MeshStandardMaterial({ map: texAlfombra, roughness: 1 }));
alfombra.rotation.x = -Math.PI / 2; alfombra.position.set(0, .015, .4); casa.add(alfombra);

// Paredes en tramos: los que miran a la cámara se desvanecen
const N = 24, tramos = [];
const HUECOS = { puerta: 90, ventana: 140 };      // grados (90 = fondo, frente a la cámara)
for (let i = 0; i < N; i++) {
  const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2, am = (a0 + a1) / 2;
  const grados = ((am * 180 / Math.PI) + 540) % 360 - 180;
  const g = new THREE.Group(); casa.add(g);
  const m = new THREE.MeshStandardMaterial({ map: texYeso, roughness: .95, transparent: true, side: THREE.DoubleSide });
  const mm = new THREE.MeshStandardMaterial({ color: 0x4a2c18, roughness: .8, transparent: true });
  const esPuerta = Math.abs(grados - HUECOS.puerta) < 8, esVentana = Math.abs(grados - HUECOS.ventana) < 8;
  const geo = new THREE.CylinderGeometry(R, R, ALTO, 4, 1, true, a0 + Math.PI / 2, a1 - a0);
  // Para la puerta y la ventana el tramo lleva un hueco: lo hacemos con tres trozos
  if (esPuerta) {
    const dintel = new THREE.Mesh(new THREE.CylinderGeometry(R, R, .9, 4, 1, true, a0 + Math.PI / 2, a1 - a0), m); dintel.position.y = ALTO - .45; g.add(dintel);
  } else if (esVentana) {
    const abajo = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 1.3, 4, 1, true, a0 + Math.PI / 2, a1 - a0), m); abajo.position.y = .65; g.add(abajo);

  if (punteros.size === 2 && pellizco) { const [a, b] = [...punteros.values()]; cam.objetivo.dist = Math.max(7, Math.min(18, pellizco.dist * pellizco.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)))); return; }
  if (!pulsado) return;
  if (!arrastrando && Math.hypot(e.clientX - pulsado.x, e.clientY - pulsado.y) > 10) arrastrando = true;
  if (arrastrando) { cam.objetivo.giro -= (e.clientX - prev.x) * .006; cam.objetivo.incl = Math.max(.35, Math.min(1.3, cam.objetivo.incl + (e.clientY - prev.y) * .004)); }
});
render.domElement.addEventListener('pointerup', (e) => {
  const fue = punteros.has(e.pointerId); punteros.delete(e.pointerId); if (punteros.size < 2) pellizco = null;
  if (!fue || !pulsado || arrastrando) { if (!punteros.size) pulsado = null; return; }
  pulsado = null; tocar(e.clientX, e.clientY);
});
render.domElement.addEventListener('wheel', (e) => { e.preventDefault(); cam.objetivo.dist = Math.max(7, Math.min(18, cam.objetivo.dist * (1 + Math.sign(e.deltaY) * .1))); }, { passive: false });
addEventListener('keydown', (e) => {
  audio.empezar();
  if (e.key === 'e' || e.key === 'E' || e.key === 'Enter') { if (!enDialogo && cerca) usar(cerca); return; }
  if (e.key === 'Escape') { cerrar(); return; }
  teclas.add(e.key.toLowerCase()); destino = null; porUsar = null;
});
addEventListener('keyup', (e) => teclas.delete(e.key.toLowerCase()));
const rayo = new THREE.Raycaster(), ptr = new THREE.Vector2();
function tocar(cx, cy) {
  if (enDialogo) { cerrar(); return; }
  ptr.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  rayo.setFromCamera(ptr, camara);
  const h = rayo.intersectObject(suelo)[0] || rayo.intersectObject(alfombra)[0];
  // ¿Ha tocado algo usable? Lo más cercano en pantalla al toque.
  let mejor = null, md = 60;
  for (const c of COSAS) {
    const w = c.pos.clone().setY(c.alto * .5).project(camara);
    const d = Math.hypot((w.x + 1) / 2 * innerWidth - cx, (1 - w.y) / 2 * innerHeight - cy);
    if (d < md) { md = d; mejor = c; }
  }
  if (mejor) { porUsar = mejor; destino = mejor.pos.clone(); return; }
  if (h) { destino = new THREE.Vector3(h.point.x, 0, h.point.z); porUsar = null; }
}
$('accion').addEventListener('click', () => cerca && usar(cerca));

// =============================================================
//  Bucle
// =============================================================
const reloj = new THREE.Clock(), V = new THREE.Vector3();
let tAndar = 0, cerca = null;
function bucle() {
  const real = reloj.getDelta(), dt = Math.min(real, .05), t = reloj.elapsedTime;
  // Cámara
  cam.giro = suave(cam.giro, cam.objetivo.giro, 1 - Math.pow(.002, dt));
  cam.incl = suave(cam.incl, cam.objetivo.incl, 1 - Math.pow(.002, dt));
  cam.dist = suave(cam.dist, cam.objetivo.dist, 1 - Math.pow(.01, dt));
  const centro = new THREE.Vector3(heroe.position.x * .35, 1.2, heroe.position.z * .35);
  camara.position.set(centro.x + Math.sin(cam.giro) * Math.cos(cam.incl) * cam.dist, centro.y + Math.sin(cam.incl) * cam.dist, centro.z + Math.cos(cam.giro) * Math.cos(cam.incl) * cam.dist);
  camara.lookAt(centro);
  // Paredes que tapan: se desvanecen
  const haciaCam = new THREE.Vector3(camara.position.x, 0, camara.position.z).normalize();
  for (const tr of tramos) {
    const tapa = tr.normal.dot(haciaCam) > .05 && cam.incl < 1.25;
    tr.alfa = suave(tr.alfa, tapa ? 0 : 1, 1 - Math.pow(.001, dt));
    for (const m of tr.mats) { m.opacity = tr.alfa; m.depthWrite = tr.alfa > .95; }
    tr.g.visible = tr.alfa > .02;
  }
  for (const c of colgados) { const ver = !(c.normal.dot(haciaCam) > .3 && cam.incl < 1.25); for (const p of c.piezas) p.visible = ver; }
  // Héroe
  let dx = 0, dz = 0;
  if (!enDialogo) {
    const fx = -Math.sin(cam.giro), fz = -Math.cos(cam.giro), rx = Math.cos(cam.giro), rz = -Math.sin(cam.giro);
    if (teclas.has('w') || teclas.has('arrowup')) { dx += fx; dz += fz; }
    if (teclas.has('s') || teclas.has('arrowdown')) { dx -= fx; dz -= fz; }
    if (teclas.has('a') || teclas.has('arrowleft')) { dx -= rx; dz -= rz; }
    if (teclas.has('d') || teclas.has('arrowright')) { dx += rx; dz += rz; }
    if (porUsar && Math.hypot(heroe.position.x - porUsar.pos.x, heroe.position.z - porUsar.pos.z) < porUsar.radio * .8) usar(porUsar);
    if (!dx && !dz && destino) { const vx = destino.x - heroe.position.x, vz = destino.z - heroe.position.z, d = Math.hypot(vx, vz); if (d < .2) destino = null; else { dx = vx / d; dz = vz / d; } }
  }
  const mov = Math.hypot(dx, dz);
  if (mov) {
    const v = 3.6 * dt / mov; let movido = false;
    for (const gi of [0, .6, -.6, 1.1, -1.1, 1.6, -1.6]) {
      const c = Math.cos(gi), s = Math.sin(gi), ex = dx * c - dz * s, ez = dx * s + dz * c, px = heroe.position.x + ex * v, pz = heroe.position.z + ez * v;
      if (libre(px, pz)) { heroe.position.set(px, 0, pz); movido = true; break; }
    }
    if (!movido) { destino = null; if (porUsar && Math.hypot(heroe.position.x - porUsar.pos.x, heroe.position.z - porUsar.pos.z) < porUsar.radio * 1.4) usar(porUsar); }
    const ep = dx * Math.cos(cam.giro) - dz * Math.sin(cam.giro); if (Math.abs(ep) > .05) planoHeroe.scale.x = ep < 0 ? -1 : 1;
    tAndar += dt * 11;
  } else tAndar = 0;
  heroe.rotation.y = cam.giro;
  planoHeroe.position.y = 1 + Math.abs(Math.sin(tAndar)) * .15; planoHeroe.rotation.z = Math.sin(tAndar) * .07;
  lofiTic(dt, t, mov);
  actualizarOtros(dt, mov, haciaCam);
  gato.rotation.y = cam.giro; gato.scale.y = 1 + Math.sin(t * 1.2) * .03;
  zzzGato.position.set(gato.position.x + .2 + Math.sin(t) * .1, .9 + (t * .3 % 1) * .6, gato.position.z); zzzGato.material.opacity = 1 - (t * .3 % 1);

  // Fuego, vela, polvo, brasas
  fuego.luz.intensity = 22 * (.8 + Math.sin(t * 9) * .1 + Math.sin(t * 23) * .08 + Math.random() * .05);
  for (const l of fuego.llamas) { const k = .8 + Math.sin(t * 11 + l.fase) * .2 + Math.sin(t * 27 + l.fase) * .1; l.s.scale.set(.38 * k, .9 * k, 1); l.s.position.x = l.x + Math.sin(t * 7 + l.fase) * .03; }
  vela.luz.intensity = 5 * (.85 + Math.sin(t * 13) * .1); vela.llama.scale.y = 1.8 + Math.sin(t * 17) * .3;
  {
    const pos = polvo.p.geometry.attributes.position;
    polvo.base.forEach(([x, y, z, f], i) => pos.setXYZ(i, x + Math.sin(t * .3 + f) * .2, y + Math.sin(t * .2 + f * 2) * .25, z + Math.cos(t * .25 + f) * .2));
    pos.needsUpdate = true;
  }
  {
    const pos = brasas.p.geometry.attributes.position, b = brasas.base;
    brasas.v.forEach((s, i) => { s.vida -= dt * .6; if (s.vida <= 0) { s.vida = 1; pos.setXYZ(i, b.x + azar(-.3, .3), b.y, b.z + azar(-.3, .3)); } else pos.setXYZ(i, pos.getX(i) + Math.sin(t * 3 + i) * .004, pos.getY(i) + dt * .9, pos.getZ(i) * .999 + 0); });
    pos.needsUpdate = true;
  }
  farolTecho.rotation.z = Math.sin(t * .6) * .05; farolTecho.rotation.x = Math.sin(t * .45) * .04;   // el vaivén de Morrandar
  hamaca.rotation.z = Math.sin(t * .6) * .015;
  vitrina.userData.aguja.rotation.y = Math.sin(t * 2.3) * .6 + Math.sin(t * 5) * .2;
  tapaBaul.rotation.x = suave(tapaBaul.rotation.x, abrirBaul ? -1.6 : 0, 1 - Math.pow(.01, dt));
  baul.userData.luz.intensity = suave(baul.userData.luz.intensity, abrirBaul ? 6 : 0, 1 - Math.pow(.01, dt));

  // ¿Qué hay cerca?
  cerca = null;
  for (const c of COSAS) if (Math.hypot(heroe.position.x - c.pos.x, heroe.position.z - c.pos.z) < c.radio) cerca = c;
  const ba = $('accion');
  if (cerca && !enDialogo) { ba.style.display = 'block'; ba.innerHTML = cerca.accion + (movil ? '' : '<kbd>E</kbd>'); } else ba.style.display = 'none';
  for (const c of COSAS) {
    const w = V.copy(c.pos).setY(c.alto).project(camara);
    c.rotulo.style.left = ((w.x + 1) / 2 * innerWidth) + 'px'; c.rotulo.style.top = ((1 - w.y) / 2 * innerHeight) + 'px';
    const tapada = Math.hypot(c.pos.x, c.pos.z) > 3.5 && V.set(c.pos.x, 0, c.pos.z).normalize().dot(haciaCam) > .3;
    c.rotulo.style.opacity = !tapada && (V.copy(c.pos).setY(c.alto).project(camara)).z < 1 && (cerca === c || Math.hypot(heroe.position.x - c.pos.x, heroe.position.z - c.pos.z) < 3.4) ? 1 : 0;
  }

  if (calidad === 'baja') render.render(escena, camara); else composer.render(dt);
  audio.tic(dt);
  requestAnimationFrame(bucle);
}
addEventListener('resize', () => { camara.aspect = innerWidth / innerHeight; camara.fov = innerWidth < innerHeight ? 60 : 46; camara.updateProjectionMatrix(); aplicarCalidad(); });
camara.fov = innerWidth < innerHeight ? 60 : 46; camara.updateProjectionMatrix();
aplicarCalidad();
requestAnimationFrame(bucle);
setTimeout(() => { $('fundido').style.opacity = 0; }, 150);
</script>
