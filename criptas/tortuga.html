    font: italic 14px/1.3 'IM Fell English', serif; pointer-events: none; transition: opacity .4s; box-shadow: 0 6px 16px rgba(0,0,0,.6); text-align: center; border-radius: 2px; }
  .habla::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: inherit; border: inherit; border-width: 0 1px 1px 0; transform: translateX(-50%) rotate(45deg); }

  .dialogo .ops button::before { content: '✠ '; color: #7a1a12; font-style: normal; }

  .aviso { left: 50%; top: 74px; transform: translateX(-50%); background: rgba(28,16,20,.88); border: 1px solid #c9944a; padding: 10px 14px; display: none; text-align: center; max-width: calc(100vw - 20px); }
  .aviso .btn { margin: 8px 4px 0; }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from './js/vendor/addons/postprocessing/EffectComposer.js';
import { RenderPass } from './js/vendor/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './js/vendor/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './js/vendor/addons/postprocessing/OutputPass.js';
import { crearMezclador } from './js/mezclador.js';
import * as Ficha from './js/viajero.js';
import { crearPanel, GESTOS } from './js/reunion.js';
import * as Pueblo from './js/pueblo.js';

// =============================================================
//  Prototipo: Morrandar, una tortuga gigante que nada por el mar
//  de tinta con un pueblo construido sobre su caparazón.
//  Atardecer, farolillos con brillo (bloom), cámara libre, la
//  cabaña del jugador y la tripulación de papel.
// =============================================================
const $ = (id) => document.getElementById(id);
const leer = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const azar = (a, b) => a + Math.random() * (b - a);
const uno = (l) => l[Math.floor(Math.random() * l.length)];
const suave = (a, b, k) => a + (b - a) * k;

const movil = matchMedia('(pointer: coarse)').matches;
const prm = new URLSearchParams(location.search);   // para pruebas: ?fija, ?x=, ?z=, ?giro=, ?incl=, ?dist=
let ficha = Ficha.fichaOCrear(leer('criptas_nombre') || 'Viajero');   // tu ficha de viajero
const CALIDADES = ['baja', 'media', 'alta'];
let calidad = leer('criptas_calidadTortuga', movil ? 'media' : 'alta');
if (!CALIDADES.includes(calidad)) calidad = 'media';

const render = new THREE.WebGLRenderer({ antialias: !movil, powerPreference: 'high-performance' });
render.setSize(innerWidth, innerHeight);
render.outputColorSpace = THREE.SRGBColorSpace;
render.toneMapping = THREE.ACESFilmicToneMapping;
render.toneMappingExposure = 1.05;
document.body.appendChild(render.domElement);

const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.5, 900);

// Postproceso: brillo suave de las luces (farolillos, ojos, sol).
const composer = new EffectComposer(render);
composer.addPass(new RenderPass(escena, camara));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.5, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function aplicarCalidad() {
  const pr = Math.min(devicePixelRatio, calidad === 'alta' ? 1.75 : calidad === 'media' ? 1.25 : 1);
  render.setPixelRatio(pr);
  composer.setPixelRatio(pr);
  render.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth * (calidad === 'alta' ? 1 : 0.5), innerHeight * (calidad === 'alta' ? 1 : 0.5));
  $('b-calidad').textContent = 'Calidad: ' + calidad;
}

function textura(w, h, pintar, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  pintar(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); }
  t.anisotropy = 8;
  return t;
}

// =============================================================
//  Cielo de atardecer
// =============================================================
const SOL = new THREE.Vector3(-0.62, 0.11, -0.78).normalize();
const cielo = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSol: { value: SOL } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 uSol; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 zen = vec3(0.035, 0.03, 0.11), alto = vec3(0.17, 0.08, 0.24), medio = vec3(0.5, 0.18, 0.28), hor = vec3(0.92, 0.42, 0.24);
      vec3 c = mix(hor, medio, smoothstep(0.0, 0.12, h));
      c = mix(c, alto, smoothstep(0.1, 0.35, h));
      c = mix(c, zen, smoothstep(0.3, 0.85, h));
      float s = max(dot(d, uSol), 0.0);
      c += vec3(0.8, 0.36, 0.16) * pow(s, 6.0) * 0.45 * (1.0 - smoothstep(0.0, 0.5, h));
      c += vec3(1.6, 1.1, .7) * pow(s, 900.0) * 1.4;       // disco del sol
      c += vec3(0.7, 0.35, 0.18) * pow(s, 40.0) * 0.3;         // halo
      if (h < 0.0) c = mix(hor * 0.55, vec3(0.06, 0.03, 0.08), smoothstep(0.0, -0.15, h));
      gl_FragColor = vec4(c, 1.0);
    }`
}));
escena.add(cielo);
escena.fog = new THREE.Fog(0x6a3346, 55, 260);
// Estrellas en lo alto, donde el cielo ya es noche
{
  const n = 700, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, e = 0.42 + Math.random() * 1.1, r = 560;
    pos.set([Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  escena.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xfff0d8, size: 1.3, fog: false, transparent: true, opacity: .75, depthWrite: false })));
}
// Luna creciente, frente al sol
{
  const luna = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshBasicMaterial({ fog: false, transparent: true, depthWrite: false, map: textura(256, 256, (g) => {
    g.fillStyle = '#f6e6c4'; g.beginPath(); g.arc(128, 128, 120, 0, 7); g.fill();
    g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(170, 104, 112, 0, 7); g.fill();
  }) }));
  luna.position.set(260, 290, -330); luna.lookAt(0, 0, 0); escena.add(luna);
}
// Nubes de algodón teñidas por el sol
const nubes = [];
{
  const tex = textura(256, 128, (g) => {
    for (let i = 0; i < 22; i++) {
      const x = 40 + Math.random() * 176, y = 50 + Math.random() * 40, r = 18 + Math.random() * 30;
      const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
  });
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, d = azar(220, 420), y = azar(25, 120);
    const cerca = Math.max(0, SOL.dot(new THREE.Vector3(Math.cos(a), 0, Math.sin(a))));
    const col = new THREE.Color().setHSL(azar(.02, .07), .7, .55 + cerca * .25).lerp(new THREE.Color(0x6a4a7a), y / 160);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: col, transparent: true, depthWrite: false, fog: false, opacity: azar(.5, .9) }));
    s.scale.set(azar(90, 180), azar(30, 55), 1); s.position.set(Math.cos(a) * d, y, Math.sin(a) * d);
    escena.add(s); nubes.push({ s, a, d, v: azar(.002, .006) });
  }
}

// ---------- Luces ----------
const hemi = new THREE.HemisphereLight(0x8a6aa8, 0x3a2018, 1.35); escena.add(hemi);
const solLuz = new THREE.DirectionalLight(0xffa868, 1.7); solLuz.position.copy(SOL).multiplyScalar(80); escena.add(solLuz);
const contraluz = new THREE.DirectionalLight(0x8a90ff, 0.55); contraluz.position.set(40, 60, 50); escena.add(contraluz);

// =============================================================
//  Mar de tinta (olas en la GPU) con el sol reflejado
// =============================================================
const uT = { value: 0 };
const OLAS = [[1, .2, .09, 0.9, .7], [.6, -.8, .16, 1.4, .34], [-.3, 1, .29, 2.1, .16], [.9, .5, .55, 3.0, .07]];
const NAVEGA = 1.1;
const NIVEL_MAR = -6;
const mar = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000, movil ? 110 : 170, movil ? 110 : 170),
  new THREE.MeshStandardMaterial({ color: 0x1c1430, roughness: .3, metalness: .45, emissive: 0x150a24 }));
mar.material.onBeforeCompile = (sh) => {
  sh.uniforms.uT = uT;
  const glsl = OLAS.map(([dx, dy, k, v, a]) => `{ vec2 d = normalize(vec2(${dx.toFixed(2)}, ${dy.toFixed(2)})); float f = dot(d, p) * ${k.toFixed(3)} + uT * ${v.toFixed(2)};
      r.x += ${a.toFixed(3)} * sin(f); r.yz += ${(a * k).toFixed(4)} * cos(f) * d; }`).join('\n');
  sh.vertexShader = 'uniform float uT;\nvec3 ola(vec2 q){ vec3 r = vec3(0.); vec2 p = q + vec2(uT * ' + NAVEGA.toFixed(2) + ', 0.);\n' + glsl + '\n return r; }\n' + sh.vertexShader;
  sh.vertexShader = sh.vertexShader
    .replace('#include <beginnormal_vertex>', 'vec3 o = ola(position.xy); vec3 objectNormal = normalize(vec3(-o.y, -o.z, 1.0));')
    .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position.xy, o.x);');
};
mar.rotation.x = -Math.PI / 2; mar.position.y = NIVEL_MAR;
escena.add(mar);
function alturaOla(x, z, t) {
  const px = x + t * NAVEGA, py = -z;
  let h = 0;
  for (const [dx, dy, k, v, a] of OLAS) { const l = Math.hypot(dx, dy); h += a * Math.sin(((dx / l) * px + (dy / l) * py) * k + t * v); }
  return h + NIVEL_MAR;
}

// =============================================================
//  Texturas pintadas
// =============================================================
const texCaparazon = textura(1024, 1024, (g, w) => {
  // Visto desde arriba: placas hexagonales con surcos, anillos de crecimiento y musgo.
  g.fillStyle = '#2a2618'; g.fillRect(0, 0, w, w);
  const R = 92, H = R * Math.sqrt(3);
  for (let fila = -1; fila < w / (R * 1.5) + 1; fila++) for (let col = -1; col < w / H + 1; col++) {
    const cx = col * H + (fila % 2 ? H / 2 : 0), cy = fila * R * 1.5;
    const dx = (cx - w / 2) / (w / 2), dy = (cy - w / 2) / (w / 2), borde = Math.hypot(dx, dy);
    const tono = 30 + Math.random() * 16, luz = 26 + Math.random() * 9 - borde * 6;
    g.save(); g.beginPath();
    for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; g.lineTo(cx + Math.cos(a) * (R - 5), cy + Math.sin(a) * (R - 5)); }
    g.closePath();
    const gr = g.createRadialGradient(cx - R * .25, cy - R * .3, 4, cx, cy, R);
    gr.addColorStop(0, `hsl(${tono}, 34%, ${luz + 12}%)`); gr.addColorStop(1, `hsl(${tono}, 30%, ${luz - 4}%)`);
    g.fillStyle = gr; g.fill(); g.clip();
    for (let r = 1; r < 6; r++) { g.strokeStyle = `rgba(255,236,190,${.05 + r * .012})`; g.lineWidth = 2.5; g.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; g.lineTo(cx + Math.cos(a) * R * r / 6.5, cy + Math.sin(a) * R * r / 6.5); } g.closePath(); g.stroke(); }
    for (let k = 0; k < 60; k++) { g.fillStyle = `rgba(0,0,0,${Math.random() * .14})`; g.fillRect(cx - R + Math.random() * R * 2, cy - R + Math.random() * R * 2, 3, 2); }
    if (Math.random() < .6) for (let k = 0; k < 9; k++) { g.fillStyle = `hsla(${80 + Math.random() * 35}, 45%, ${22 + Math.random() * 14}%, .8)`; g.beginPath(); g.ellipse(cx + (Math.random() - .5) * R * 1.6, cy + (Math.random() - .5) * R * 1.6, 8 + Math.random() * 22, 5 + Math.random() * 12, Math.random() * 3, 0, 7); g.fill(); }
    g.restore();
    g.strokeStyle = 'rgba(10,8,4,.9)'; g.lineWidth = 9; g.beginPath();
    for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; g.lineTo(cx + Math.cos(a) * (R - 5), cy + Math.sin(a) * (R - 5)); }
    g.closePath(); g.stroke();
  }
  // Percebes hacia el borde (donde moja la tinta)
  for (let k = 0; k < 1400; k++) {
    const a = Math.random() * 7, r = .78 + Math.random() * .22;
    g.fillStyle = `rgba(${210 + Math.random() * 30},${196 + Math.random() * 30},170,.55)`;
    g.beginPath(); g.arc(w / 2 + Math.cos(a) * r * w / 2, w / 2 + Math.sin(a) * r * w / 2, 1 + Math.random() * 3.5, 0, 7); g.fill();
  }
});
const texPiel = textura(512, 256, (g, w, h) => {
  g.fillStyle = '#4c5e58'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 900; k++) {
    const x = Math.random() * w, y = Math.random() * h, r = 3 + Math.random() * 9;
    g.fillStyle = `hsl(${150 + Math.random() * 30}, ${14 + Math.random() * 10}%, ${28 + Math.random() * 16}%)`;
    g.beginPath(); g.ellipse(x, y, r, r * .8, Math.random() * 3, 0, 7); g.fill();
    g.strokeStyle = 'rgba(10,20,18,.5)'; g.lineWidth = 1.2; g.stroke();
  }
  for (let k = 0; k < 40; k++) { g.fillStyle = 'rgba(30,24,18,.35)'; g.beginPath(); g.arc(Math.random() * w, Math.random() * h, 6 + Math.random() * 14, 0, 7); g.fill(); }
}, [3, 2]);
const texAdoquin = textura(256, 256, (g, w) => {
  g.fillStyle = '#3e3430'; g.fillRect(0, 0, w, w);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const px = x * 32 + (y % 2) * 16 + (Math.random() - .5) * 3, py = y * 32 + (Math.random() - .5) * 3;
    g.fillStyle = `hsl(${22 + Math.random() * 16}, ${12 + Math.random() * 10}%, ${40 + Math.random() * 14}%)`;
    g.beginPath(); g.roundRect(px + 2, py + 2, 28, 28, 8); g.fill();
    g.fillStyle = 'rgba(255,240,210,.08)'; g.beginPath(); g.roundRect(px + 4, py + 3, 20, 10, 5); g.fill();
    if (Math.random() < .15) { g.fillStyle = 'rgba(70,110,40,.5)'; g.fillRect(px, py + 26, 32, 4); }
  }
}, [1, 1]);
const texMuro = textura(256, 128, (g, w, h) => {
  g.fillStyle = '#2e2622'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const px = x * 32 + (y % 2) * 16, py = y * 16;
    g.fillStyle = `hsl(${20 + Math.random() * 14}, ${10 + Math.random() * 10}%, ${30 + Math.random() * 14}%)`;
    g.fillRect(px + 1, py + 1, 30, 14);
  }
  for (let k = 0; k < 30; k++) { g.fillStyle = 'rgba(80,120,50,.45)'; g.beginPath(); g.ellipse(Math.random() * w, h - Math.random() * 40, 8 + Math.random() * 14, 4, 0, 0, 7); g.fill(); }
}, [10, 1]);
const texTela = textura(128, 128, (g, w, h) => {
  g.fillStyle = '#7a2a20'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#c8a050'; for (let x = 0; x < w; x += 32) g.fillRect(x, 0, 14, h);
});

const mat = {
  caparazon: new THREE.MeshStandardMaterial({ map: texCaparazon, roughness: .78, metalness: .05 }),
  borde: new THREE.MeshStandardMaterial({ color: 0x2e2a1e, roughness: .9 }),
  piel: new THREE.MeshStandardMaterial({ map: texPiel, roughness: .7 }),
  adoquin: new THREE.MeshStandardMaterial({ map: texAdoquin, roughness: .92 }),
  muro: new THREE.MeshStandardMaterial({ map: texMuro, roughness: .95 }),

  if (!p.ruta && !p.gato) return false;
  if (!p.meta) {
    if (p.gato) { let x, z, n = 0; do { x = azar(-12, 12); z = azar(-7, 7); n++; } while (!libre(x, z, 1) && n < 20); p.meta = [x, z]; }
    else { p.meta = p.ruta[p.paso]; p.paso = (p.paso + 1) % p.ruta.length; }
  }
  const dx = p.meta[0] - p.x, dz = p.meta[1] - p.z, d = Math.hypot(dx, dz);
  if (d < .2) { p.meta = null; p.parado = p.gato ? azar(2, 7) : azar(1, 3); return false; }
  p.x += dx / d * p.vel * dt; p.z += dz / d * p.vel * dt;
  p.fig.position.set(p.x, 0, p.z);
  p.dirX = dx * Math.cos(cam.giro) - dz * Math.sin(cam.giro);
  return true;
}

function bucle() {
  if (cabanaAbierta) { reloj.getDelta(); requestAnimationFrame(bucle); return; }   // en pausa mientras estás en la cabaña
  const real = reloj.getDelta(), dt = Math.min(real, .05), t = reloj.elapsedTime;
  uT.value = t;

  // Morrandar nada: sube y baja con calma, cabecea y rema
  const brazada = Math.sin(t * .55);
  tortuga.position.y = Math.sin(t * .4) * .3 + brazada * .08;
  tortuga.rotation.z = Math.sin(t * .27) * .012 + brazada * .006;
  tortuga.rotation.x = Math.sin(t * .33) * .01;
  for (const a of aletas) {
    const f = t * .55 + a.fase;
    a.piv.rotation.x = a.s * (Math.sin(f) * (a.delantera ? .35 : .25) - .1);
    a.piv.rotation.y = a.s * Math.cos(f) * (a.delantera ? .28 : .2);
  }
  despierta = Math.max(0, despierta - dt);
  cabeza.rotation.z = Math.sin(t * .3) * .05 + (despierta > 0 ? Math.sin(t * 2) * .05 + .08 : 0);
  cabeza.rotation.y = Math.sin(t * .17) * .12;
  cabeza.position.y = 3.6 + Math.sin(t * .4 + 1) * .25 + (despierta > 0 ? .8 : 0) * Math.min(1, despierta);
  parpadeo -= dt;
  const cierre = parpadeo < 0 ? Math.max(0, 1 - Math.abs(parpadeo + .12) / .12) : 0;
  if (parpadeo < -.24) parpadeo = azar(2.5, 7);
  for (const p of parpados) { p.rotation.z = -Math.PI / 2 + .2 + (despierta > 0 ? -.5 : 0); p.scale.y = .25 + cierre * .8; }

  // Héroe: movimiento relativo a la cámara
  let dx = 0, dz = 0;
  if (!enDialogo) {
    const fx = -Math.sin(cam.giro), fz = -Math.cos(cam.giro), rx = Math.cos(cam.giro), rz = -Math.sin(cam.giro);
    if (teclas.has('w') || teclas.has('arrowup')) { dx += fx; dz += fz; }
    if (teclas.has('s') || teclas.has('arrowdown')) { dx -= fx; dz -= fz; }
    if (teclas.has('a') || teclas.has('arrowleft')) { dx -= rx; dz -= rz; }
    if (teclas.has('d') || teclas.has('arrowright')) { dx += rx; dz += rz; }
    if (porHablar && Math.hypot(heroe.position.x - porHablar.x, heroe.position.z - porHablar.z) < porHablar.radio * .8) interactuar(porHablar);
    if (!dx && !dz && destino) {
      const vx = destino.x - heroe.position.x, vz = destino.z - heroe.position.z, d = Math.hypot(vx, vz);
      if (d < .25) destino = null; else { dx = vx / d; dz = vz / d; }
    }
  }
  const mov = Math.hypot(dx, dz);
  if (mov) {
    const v = 5.4 * dt / mov;
    let movido = false;
    for (const giro of [0, .6, -.6, 1.1, -1.1, 1.6, -1.6]) {
      const c = Math.cos(giro), s = Math.sin(giro), ex = dx * c - dz * s, ez = dx * s + dz * c;
      const px = heroe.position.x + ex * v, pz = heroe.position.z + ez * v;
      if (libre(px, pz)) { heroe.position.set(px, 0, pz); movido = true; break; }
    }
    if (!movido) { destino = null; if (porHablar && Math.hypot(heroe.position.x - porHablar.x, heroe.position.z - porHablar.z) < porHablar.radio * 1.3) interactuar(porHablar); }
    const enPantalla = dx * Math.cos(cam.giro) - dz * Math.sin(cam.giro);
    if (Math.abs(enPantalla) > .05) planoHeroe.scale.x = enPantalla < 0 ? -1 : 1;
    tAndar += dt * 11;
  } else tAndar = 0;
  heroe.rotation.y = cam.giro;
  planoHeroe.position.y = 1.1 + Math.abs(Math.sin(tAndar)) * .18;
  planoHeroe.rotation.z = Math.sin(tAndar) * .07;
  animarGesto(yoAvatar, dt, mov > 0);
  panelSala?.R?.mover(heroe.position.x, heroe.position.z, planoHeroe.scale.x < 0 ? -1 : 1);
  // Los demás viajeros: se deslizan hacia donde dicen que están
  for (const o of otros.values()) {
    const p = o.g.position, ddx = o.x - p.x, ddz = o.z - p.z, d = Math.hypot(ddx, ddz);
    const anda = d > .08;
    if (d > 8) p.set(o.x, 0, o.z);
    else if (anda) { const v = Math.min(d, Math.max(5.4, d * 4) * dt); p.x += ddx / d * v; p.z += ddz / d * v; o.tAndar += dt * 11; } else o.tAndar = 0;
    o.g.rotation.y = cam.giro;
    o.plano.scale.x = o.lado < 0 ? -1 : 1;
    o.plano.position.y = 1.1 + Math.abs(Math.sin(o.tAndar)) * .18;
    o.plano.rotation.z = Math.sin(o.tAndar) * .07;
    animarGesto(o, dt, anda);
  }

  // Tripulación
  for (const p of PNJ) {
    if (!p.fig) continue;
    const anda = moverFigura(p, dt);
    const pl = p.fig.userData.plano, alto = p.fig.userData.alto;
    p.fig.rotation.y = cam.giro;
    if (anda) { p.tPaso = (p.tPaso || 0) + dt * 10; pl.position.y = alto / 2 + .12 + Math.abs(Math.sin(p.tPaso)) * .12; pl.rotation.z = Math.sin(p.tPaso) * .06; if (p.dirX) pl.scale.x = p.dirX < 0 ? -1 : 1; }
    else { pl.position.y = alto / 2 + .12; pl.rotation.z *= .9; pl.scale.y = 1 + Math.sin(t * 1.6 + p.x) * .012; }
    if (p.habla) {
      p.hastaHablar -= dt;
      if (p.hastaHablar <= 0 && !enDialogo && Math.hypot(heroe.position.x - p.x, heroe.position.z - p.z) < 9) { p.habla.textContent = uno(p.frases); p.hablando = 3.6; p.hastaHablar = azar(10, 22); }
      p.hablando -= dt;
    }
  }
  // Caña y sedal del Anzuelo, hasta el mar
  {
    const punta = cana.localToWorld(new THREE.Vector3(0, 4.5, 0));
    const pique = Math.max(0, Math.sin(t * .6)) ** 12;
    cana.rotation.x = -1.05 + pique * .3 + Math.sin(t * 1.3) * .03;
    const agua = new THREE.Vector3(punta.x + 1, alturaOla(punta.x, punta.z - 7, t), punta.z - 7.5);
    sedal.geometry.setFromPoints([punta, agua]);
  }
  for (const c of pajaros) {
    const a = t * c.vel + c.fase;
    c.g.position.set(Math.cos(a) * c.r, c.alt + Math.sin(t * .7 + c.fase), Math.sin(a) * c.r * .7);
    c.g.rotation.y = -a + (c.vel > 0 ? -Math.PI / 2 : Math.PI / 2);
    const aleteo = Math.sin(t * 7 + c.fase) * .6; c.p1.rotation.x = aleteo; c.p2.rotation.x = -aleteo;
  }
  // Cosas pequeñas que dan vida
  for (const f of farolillosArbol) f.f.position.y += Math.sin(t * 1.4 + f.fase) * .002;
  {
    const pos = hojas.p.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let y = pos.getY(i) - dt * hojas.v[i] * .6;
      if (y < .05) y = azar(5, 7.4);
      pos.setXYZ(i, pos.getX(i) + Math.sin(t * 1.3 + i) * .008, y, pos.getZ(i) + Math.cos(t + i) * .006);
    }
    pos.needsUpdate = true;
  }
  {
    const pos = luciernagas.p.geometry.attributes.position;
    luciernagas.base.forEach(([x, y, z, f], i) => pos.setXYZ(i, x + Math.sin(t * .5 + f) * 1.2, y + Math.sin(t * .9 + f * 2) * .5, z + Math.cos(t * .4 + f) * 1.2));
    pos.needsUpdate = true;
    luciernagas.p.material.opacity = .65 + Math.sin(t * 3) * .25;
  }
  {
    const pos = humo.p.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      humo.vida[i] += dt * .18;
      if (humo.vida[i] > 1) { humo.vida[i] = 0; const b = humos[i % humos.length]; if (b.casa.visible) pos.setXYZ(i, b.x, b.y, b.z); else pos.setXYZ(i, 0, -999, 0); }
      else pos.setXYZ(i, pos.getX(i) - dt * .4, pos.getY(i) + dt * .9, pos.getZ(i) + Math.sin(t + i) * dt * .2);
    }
    pos.needsUpdate = true;
  }
  {
    const pos = motas.p.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let y = pos.getY(i) + dt * (.4 + motas.vel[i] * .6); if (y > 5.4) y = 1.6;
      const s = (y - 1.6) * .35; pos.setXYZ(i, 3.4 + Math.sin(t + i) * s, y, 2.2 + Math.cos(t * .8 + i * 2) * s);
    }
    pos.needsUpdate = true;
  }
  // Espuma: en la línea de flotación y donde reman las aletas
  {
    const pos = espuma.p.geometry.attributes.position;
    for (let i = 0; i < espuma.d.length; i++) {
      const s = espuma.d[i];
      if (s.vida <= 0) {
        if (Math.random() < .05) {
          s.vida = azar(.8, 1.6);
          if (Math.random() < .5) { const a = aletas[Math.floor(Math.random() * 4)]; const w = a.piv.localToWorld(V.set(azar(-2, 6), 0, a.s * azar(2, 7))); pos.setXYZ(i, w.x, NIVEL_MAR + .2, w.z); s.vx = azar(-1.5, -.5); s.vy = azar(.5, 2); s.vz = azar(-.5, .5); }
          else { const a = azar(-1.2, 1.2) + (Math.random() < .5 ? 0 : Math.PI); const r = 21.5; pos.setXYZ(i, Math.cos(a) * r * (a > 1.6 ? 1 : 1.25), NIVEL_MAR + .3, Math.sin(a) * 17); s.vx = -NAVEGA * 1.5; s.vy = azar(.2, .9); s.vz = azar(-.3, .3); }
        } else { pos.setY(i, -99); continue; }
      }
      s.vida -= dt; s.vy -= 3 * dt;
      pos.setXYZ(i, pos.getX(i) + s.vx * dt, Math.max(NIVEL_MAR - .2, pos.getY(i) + s.vy * dt), pos.getZ(i) + s.vz * dt);
    }
    pos.needsUpdate = true;
  }
  for (const d of deriva) {
    d.o.position.x -= NAVEGA * dt;
    if (d.o.position.x < -170) { d.o.position.x = 170; d.o.position.z = Math.random() < .5 ? azar(-120, -26) : azar(26, 90); }
    d.o.position.y = alturaOla(d.o.position.x, d.o.position.z, t) + .05;
    d.o.rotation.z += d.giro * dt;
  }
  for (const n of nubes) { n.a += n.v * dt; n.s.position.x = Math.cos(n.a) * n.d; n.s.position.z = Math.sin(n.a) * n.d; }
  luzLibro.intensity = 9 + Math.sin(t * 2) * 2.5;
  luces.forEach((l, i) => { l.intensity = 26 * (.88 + Math.sin(t * 8 + i * 2) * .06 + Math.sin(t * 19 + i) * .04); });

  // ¿Hay alguien cerca?
  cerca = null;
  for (const p of PNJ) if (Math.hypot(heroe.position.x - p.x, heroe.position.z - p.z) < p.radio) cerca = p;
  const ba = $('accion');
  if (cerca && !enDialogo) { ba.style.display = 'block'; ba.innerHTML = `${cerca.accion || 'Hablar con ' + cerca.nombre.replace(/^(El|La) /, '').split(' ')[0]}${movil ? '' : '<kbd>E</kbd>'}`; }
  else ba.style.display = 'none';

  // Cámara libre que sigue al héroe
  cam.giro = suave(cam.giro, cam.objetivo.giro, 1 - Math.pow(.002, dt));
  cam.incl = suave(cam.incl, cam.objetivo.incl, 1 - Math.pow(.002, dt));
  cam.dist = suave(cam.dist, cam.objetivo.dist, 1 - Math.pow(.01, dt));
  const objetivo = heroe.getWorldPosition(new THREE.Vector3());
  const off = new THREE.Vector3(Math.sin(cam.giro) * Math.cos(cam.incl), Math.sin(cam.incl), Math.cos(cam.giro) * Math.cos(cam.incl)).multiplyScalar(cam.dist);
  const deseada = sinChocar(objetivo.clone().add(new THREE.Vector3(0, 1.4, 0)), objetivo.clone().add(off));
  if (t < INTRO && !enDialogo && !destino && !mov) {
    // Toma de entrada: vuelta lenta alrededor de Morrandar antes de bajar al pueblo
    const a = 1.05 - t * .16, r = 78 - t * 6;
    camPos.set(Math.cos(a) * r, 30 - t * 2.5, Math.sin(a) * r);
    camMira.set(8, -1.5, 0);
  } else {
    const k = t < INTRO + 3 ? .35 : .02;
    camPos.lerp(deseada, 1 - Math.pow(k, dt));
    camMira.lerp(objetivo.clone().add(new THREE.Vector3(0, 1.4, 0)), 1 - Math.pow(k * .5, dt));
  }
  camara.position.copy(camPos); camara.lookAt(camMira);

  // Rótulos y bocadillos
  for (const p of PNJ) {
    const alto = p.fig ? p.fig.userData.alto + .5 : p.id === 'libro' ? 2.6 : p.id === 'morrandar' ? 3.4 : 4;
    const w = (p.id === 'morrandar' ? tortuga.localToWorld(V.set(30, 8.4, 0)) : pueblo.localToWorld(V.set(p.x, alto, p.z))).project(camara);
    const sx = (w.x + 1) / 2 * innerWidth, sy = (1 - w.y) / 2 * innerHeight;
    const dist = Math.hypot(heroe.position.x - p.x, heroe.position.z - p.z);
    const hablando = p.habla && p.hablando > 0 && !enDialogo && w.z < 1;
    p.rotulo.style.left = sx + 'px'; p.rotulo.style.top = sy + 'px';
    p.rotulo.style.opacity = w.z < 1 && !hablando && (cerca === p || dist < 6) ? 1 : 0;
    if (p.habla) { p.habla.style.left = sx + 'px'; p.habla.style.top = (sy - 4) + 'px'; p.habla.style.opacity = hablando ? 1 : 0; }
  }

  for (const o of [yoAvatar, ...otros.values()]) {
    const w = o.g.localToWorld(V.set(0, 2.6, 0)).project(camara);
    const sx = (w.x + 1) / 2 * innerWidth, sy = (1 - w.y) / 2 * innerHeight, vis = w.z < 1;
    o.hablando -= dt;
    o.habla.style.left = sx + 'px'; o.habla.style.top = (sy - 4) + 'px'; o.habla.style.opacity = vis && o.hablando > 0 ? 1 : 0;
    if (o.rotulo) { o.rotulo.style.left = sx + 'px'; o.rotulo.style.top = (sy + 2) + 'px'; o.rotulo.style.opacity = vis && o.hablando <= 0 ? .9 : 0; }
  }

  if (calidad === 'baja') render.render(escena, camara); else composer.render(dt);
  audio.tic(dt);

  cuadros++; tMedida += real;
  if (tMedida >= 1) {
    const fps = cuadros / tMedida; $('fps').textContent = Math.round(fps) + ' fps';
    if (fps < 24 && t > 5) lentos++; else lentos = 0;
    if (lentos === 3 && calidad !== 'baja' && !fija) { calidad = calidad === 'alta' ? 'media' : 'baja'; aplicarCalidad(); lentos = 0; }
    if (lentos >= 5 && calidad === 'baja' && !avisado) {
      avisado = true;
      const av = $('aviso');
      av.innerHTML = 'Esto va a tirones en este dispositivo.<br><button class="btn" id="av-libro">Ver la base como libro</button><button class="btn" id="av-no">Seguir aquí</button>';
      av.style.display = 'block';
      $('av-libro').onclick = () => $('b-libro').click();
      $('av-no').onclick = () => { av.style.display = 'none'; };
    }
    cuadros = 0; tMedida = 0;
  }
  requestAnimationFrame(bucle);
}
addEventListener('resize', () => { camara.aspect = innerWidth / innerHeight; camara.fov = innerWidth < innerHeight ? 62 : 50; camara.updateProjectionMatrix(); aplicarCalidad(); });
camara.fov = innerWidth < innerHeight ? 62 : 50; camara.updateProjectionMatrix();
aplicarCalidad();
requestAnimationFrame(bucle);
setTimeout(() => { $('fundido').style.opacity = 0; }, 200);
</script>
