<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1220; font-family: Nunito, system-ui, sans-serif; color: #3a2a20; touch-action: manipulation; -webkit-user-select: none; user-select: none; }

  .fila-botones { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .lista .fila, #panel .fila { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; background: #fff0cc; border-radius: 12px; padding: 6px 8px; margin: 5px 0; }

  #bSala { position: fixed; right: 10px; top: calc(max(10px, env(safe-area-inset-top)) + 50px); z-index: 6; border: 0; font: inherit; font-weight: 900; padding: 8px 12px; cursor: pointer; }

  /* la carta */
  .carta { position: relative; width: min(74px, calc((100vw - 32px) / 5)); height: 104px; box-sizing: border-box; border-radius: 10px; background: var(--fondo); border: 3px solid var(--borde); box-shadow: 0 4px 10px #0007; display: flex; flex-direction: column; align-items: center; padding: 3px 3px 2px; cursor: pointer; transition: transform .12s; flex: 0 0 auto; }

  .carta .dib { font-size: 30px; line-height: 38px; } .carta b { font-size: 9.5px; line-height: 1.05; text-align: center; font-weight: 900; height: 21px; overflow: hidden; }

  .carta .orden { position: absolute; top: -10px; right: -8px; background: #ff5a3a; color: #fff; font-style: normal; font-weight: 900; border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; font-size: 13px; }
  .carta.mini { width: 60px; height: 84px; cursor: default; } .carta.mini .dib { font-size: 24px; line-height: 30px; } .carta.mini b { font-size: 8px; height: 17px; } .carta.mini em { font-size: 8.5px; }

  /* el duelo */
  #hud { position: fixed; left: 8px; right: 8px; top: max(8px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; z-index: 4; pointer-events: none; }

  #hud .turno { background: #2a1e2ae6; color: #fff8e6; border-radius: 12px; padding: 4px 10px; font-weight: 900; font-size: 12px; }
  #mano { position: fixed; left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 4px; z-index: 4; padding: 0 6px; }

  #acciones button { border: 0; border-radius: 14px; background: #fff8e6; padding: 10px 14px; font: inherit; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #c8a86a; } #acciones button.grande { background: #ffcf4a; box-shadow: 0 4px 0 #c8962a; } #acciones button:disabled { opacity: .7; cursor: default; }
