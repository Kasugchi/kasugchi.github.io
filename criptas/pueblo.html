// =============================================================
//  EL PUEBLO DE MORRANDAR (prueba): un pueblo a pie de calle,
//  con el mundo que se curva a lo lejos, sobre el caparazón.
//  Al norte, desde el mirador, se ve la cabeza de Morrandar.
// =============================================================
const $ = (id) => document.getElementById(id);
const prm = new URLSearchParams(location.search);
const leer = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const guardarLS = (k, v) => { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } };

const heroeF = ficha?.heroes?.[ficha.activo] || null;
const CLASE = heroeF?.tipo || leer('criptas_claseBase', 'barbaro');
const NOMBRE = ficha?.nombre || leer('criptas_nombre', '') || heroeF?.nombre || 'Viajero';   // en el pueblo eres tú, no tu héroe
const DIARIO = ficha?.diario || { misiones: 0, victorias: 0, jefes: 0, monstruos: 0, pisoMax: 0 };
const FAMA = ficha?.tortuga?.fama ?? 0;
const TROFEO = ficha?.cabana?.trofeos?.slice(-1)[0] || null;
const uno = (l) => l[Math.floor(Math.random() * l.length)];
// Lo que pasa en el pueblo se guarda en la ficha del mundo (ficha.pueblo) y viaja con la cuenta.
let fichaP = null; try { fichaP = Ficha.fichaOCrear(NOMBRE); } catch { fichaP = null; }
const EP = (() => { const p = fichaP ? (fichaP.pueblo ||= {}) : {}; p.amistad ||= {}; p.hoy ||= {}; p.hitos ||= {}; p.regalos ||= []; p.cogidas ||= {}; p.flores ||= 0; p.lumi ||= 0; if (p.encargo === undefined) p.encargo = null;
  p.tengo ||= {}; p.buzon ||= []; p.recogidos ||= []; p.mueblesDe ||= {}; return p; })();
let sala = null, musicaCasa = false;   // dónde estás por dentro: 'cantina', 'casa' o fuera (null)
function guardarPueblo() { if (!fichaP) return; try { fichaP.pueblo = EP; Ficha.tocar(fichaP); Ficha.guardarFicha(fichaP); } catch { /* sin almacenamiento */ } }
function juntarPueblo(otro) {   // lo de otro dispositivo: nos quedamos con lo más avanzado
  if (!otro) return;
  for (const [k, v] of Object.entries(otro.amistad || {})) EP.amistad[k] = Math.max(EP.amistad[k] || 0, v);
  for (const [k, v] of Object.entries(otro.hitos || {})) EP.hitos[k] = Math.max(EP.hitos[k] || 0, v);
  for (const [k, v] of Object.entries(otro.hoy || {})) if (!EP.hoy[k] || v > EP.hoy[k]) EP.hoy[k] = v;

//  EL CIELO: día y noche con la hora del pueblo, cuatro estaciones
//  (una por semana del pueblo) y el tiempo de cada día: lluvia o nieve.

// =============================================================
const ESTACIONES = [
  { id: 'primavera', n: 'Primavera', ico: '🌸', tinte: '#ffffff', lluvia: .3 },
  { id: 'verano', n: 'Verano', ico: '🌻', tinte: '#fff1d2', lluvia: .12 },
  { id: 'otono', n: 'Otoño', ico: '🍂', tinte: '#f0d8b0', lluvia: .42 },
