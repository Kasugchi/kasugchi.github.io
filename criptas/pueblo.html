function animar(ch, dt, andando, t) {
  const u = ch.userData;
  u.fase += dt * (andando ? (andando > 1 ? 15 : 11) : 2);
  if (u.gato) { u.cuerpo.position.y = andando ? Math.abs(Math.sin(u.fase)) * .04 : 0; return; }
  if (u.sentado) {
    u.piernas.forEach((p) => { p.rotation.x = -1.45; }); u.brazos.forEach((b, i) => { b.rotation.x = -.4; });
    u.cuerpo.position.y = -.28 + Math.sin(t * 1.4) * .006;
  } else {
    const a = andando ? Math.sin(u.fase) * .7 : 0;
    u.piernas[0].rotation.x = a; u.piernas[1].rotation.x = -a;
    u.brazos[0].rotation.x = -a * .8; u.brazos[1].rotation.x = a * .8;
    u.cuerpo.position.y = andando ? Math.abs(Math.sin(u.fase)) * .06 : Math.sin(u.fase) * .01;
  }
  u.cabeza.rotation.z = andando ? Math.sin(u.fase * .5) * .04 : Math.sin(t * .7 + u.fase) * .03;

}
