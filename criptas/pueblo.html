      ['¿Qué suena?', () => hablar('Marga', [DISCOS[disco].archivo ? `«${DISCOS[disco].nombre}». Me la trajo un viajero. Dice que la hizo él.` : `«${DISCOS[disco].nombre}». Si te cansa, cambia el disco del gramófono.`], null, MARGA.color, MARGA.voz)],
      ['Nada, gracias', cerrarDialogo]], MARGA.color, MARGA.voz);
}

// =============================================================
//  DENTRO Y FUERA, SENTARSE, IR A OTRAS PÁGINAS
// =============================================================
let dentro = false, modoCam = 'normal';
function fundir(f) { $('fundido').style.opacity = 1; setTimeout(() => { f(); setTimeout(() => { $('fundido').style.opacity = 0; }, 120); }, 600); }
function irA(url) { cerrarDialogo(); $('fundido').style.opacity = 1; setTimeout(() => { location.href = url; }, 650); }
function aviso(t) { const a = $('aviso'); a.textContent = t; a.style.opacity = 1; clearTimeout(aviso.t); aviso.t = setTimeout(() => { a.style.opacity = 0; }, 2200); }
function entrarCantina() {
  fundir(() => {
    dentro = true; cantinaDentro.visible = true; J.x = X0; J.z = 3.8; J.dir = Math.PI; J.ir = null; levantar();
    CURVA.uCurva.value = 0; cielo.intensity = .55; sol.intensity = .35; luzFuego.intensity = 22; lamparas.forEach((l) => { l.intensity = 9; });
    escena.background = new THREE.Color('#2a1a12'); escena.fog = null;
    camara.position.set(X0, 8.4, 12.6); mirar.set(X0, .6, -.4); mezclar(true);
  });
}
function salirCantina() {
  cerrarDialogo();
  fundir(() => {
    dentro = false; cantinaDentro.visible = false; J.x = cantina.puerta.x; J.z = cantina.puerta.z + .4; J.dir = 0; J.ir = null; levantar();
    CURVA.uCurva.value = Number(prm.get('curva')) || 0.0105; cielo.intensity = 1.25; sol.intensity = 1.7; luzFuego.intensity = 0; lamparas.forEach((l) => { l.intensity = 0; });
    escena.background = CIELO; escena.fog = new THREE.Fog(CIELO, 34, 72);
    camara.position.set(J.x, 10.8, J.z + 10.6); mirar.set(J.x, .7, J.z - 1.6); mezclar(false);
  });
}
function sentarse(x, z, dir) { cerrarDialogo(); J.x = x; J.z = z; J.dir = dir; J.sentado = true; J.ch.userData.sentado = true; aviso('Toca para levantarte'); }
function levantar() { J.sentado = false; J.ch.userData.sentado = false; if (modoCam === 'mirador') modoCam = 'normal'; }
function sentarseMirador() {
  J.x = 18; J.z = -24.5; J.dir = -2.82; J.sentado = true; J.ch.userData.sentado = true; modoCam = 'mirador'; miradaM = 1;
  setTimeout(() => { if (modoCam === 'mirador') hablar('Morrandar', ['La tortuga nada despacio entre las páginas.', 'Gira la cabeza… y te mira. Un rumor grave te hace vibrar los huesos.', 'Parece decir: «Estás en casa».'], null, '#647e55', 90); }, 1800);
}

// =============================================================
//  MOVIMIENTO, CHOQUES Y CONTROLES
// =============================================================
function libreFuera(x, z, r, quien) {
  if (x < -33 || x > 33 || z < -28.5 || z > 29.5) return false;
  if (!enPuente(x, z) && !enMuelle(x, z) && alto(x, z) < -.28) return false;
  for (const c of CHOQUES) { if (c.r) { if (Math.hypot(x - c.x, z - c.z) < c.r + r) return false; } else if (Math.abs(x - c.x) < c.w / 2 + r && Math.abs(z - c.z) < c.d / 2 + r) return false; }
  for (const p of PNJ) if (p !== quien && Math.hypot(x - p.x, z - p.z) < .5 + r * .5) return false;
  if (quien && Math.hypot(x - J.x, z - J.z) < .7) return false;
  return true;
}
function libreDentro(x, z, r) {
  if (x < X0 - 5.5 || x > X0 + 5.5 || z < -4.4 || z > 4.9) return false;
  for (const c of CHOQUES_DENTRO) { if (c.r) { if (Math.hypot(x - c.x, z - c.z) < c.r + r) return false; } else if (Math.abs(x - c.x) < c.w / 2 + r && Math.abs(z - c.z) < c.d / 2 + r) return false; }
  return true;
}
const libre = (x, z, r = .32, quien = null) => (dentro ? libreDentro(x, z, r) : libreFuera(x, z, r, quien));
const sueloEn = (x, z) => (dentro ? 0 : enMuelle(x, z) ? .36 : enPuente(x, z) ? .21 : Math.max(alto(x, z), -.3));
const teclas = new Set();
addEventListener('keydown', (e) => {
  arrancarAudio();
  if (e.key === 'e' || e.key === 'E' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (enDialogo) avanzarDialogo(); else if (cercano) usar(cercano); return; }
  if (e.key === 'Escape') { if (enDialogo && !opsDialogo) cerrarDialogo(); return; }
  teclas.add(e.key.toLowerCase()); if (J.sentado && /^(w|a|s|d|arrow)/.test(e.key.toLowerCase())) levantar();
});
addEventListener('keyup', (e) => teclas.delete(e.key.toLowerCase()));
// Tocar el suelo: andar hasta ahí (manteniendo, sigue al dedo). Tocar a alguien: ir y hablar.
const rayo = new THREE.Raycaster(), ptr = new THREE.Vector2(), plano = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), punto = new THREE.Vector3();
function aSuelo(cx, cy) {
  ptr.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1); rayo.setFromCamera(ptr, camara);
  let y = 0;
  for (let i = 0; i < 3; i++) { plano.constant = -y; if (!rayo.ray.intersectPlane(plano, punto)) return null; y = dentro ? 0 : -bajada(punto.z); }
  return punto.clone();
}
let pulsando = false;
render.domElement.addEventListener('pointerdown', (e) => {
  arrancarAudio();
  if (enDialogo) { avanzarDialogo(); return; }
  if (J.sentado) { levantar(); return; }
  const p = aSuelo(e.clientX, e.clientY); if (!p) return;
  const it = INTERACCION.filter((i) => !!i.dentro === dentro).map((i) => ({ i, d: Math.hypot(posDe(i).x - p.x, posDe(i).z - p.z) })).filter((x) => x.d < 1.4).sort((a, b) => a.d - b.d)[0];
  if (it) { const q = posDe(it.i); J.ir = { x: q.x, z: q.z, hacer: () => usar(it.i), cerca: it.i.pnj ? (it.i.pnj.alcance || 1.7) - .4 : .6 }; return; }
  J.ir = { x: p.x, z: p.z }; pulsando = true;
});
render.domElement.addEventListener('pointermove', (e) => { if (!pulsando) return; const p = aSuelo(e.clientX, e.clientY); if (p) J.ir = { x: p.x, z: p.z }; });
addEventListener('pointerup', () => { pulsando = false; });
const posDe = (i) => (i.pnj ? { x: i.pnj.x, z: i.pnj.z } : i);
function usar(i) { J.ir = null; if (i.pnj) { const p = i.pnj; J.dir = Math.atan2(p.x - J.x, p.z - J.z); } i.hacer(); }
const angLerp = (a, b, k) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * k; };
function moverJugador(dt, t) {
  let dx = 0, dz = 0, andando = 0;
  if (!enDialogo && !J.sentado) {
    if (teclas.has('a') || teclas.has('arrowleft')) dx -= 1;
    if (teclas.has('d') || teclas.has('arrowright')) dx += 1;
    if (teclas.has('w') || teclas.has('arrowup')) dz -= 1;
    if (teclas.has('s') || teclas.has('arrowdown')) dz += 1;
    if (dx || dz) J.ir = null;
    else if (J.ir) {
      const vx = J.ir.x - J.x, vz = J.ir.z - J.z, d = Math.hypot(vx, vz);
      if (d < (J.ir.cerca || .2)) { const f = J.ir.hacer; J.ir = null; if (f) f(); } else { dx = vx / d; dz = vz / d; }
    }
  }
  const len = Math.hypot(dx, dz);
  if (len) {
    dx /= len; dz /= len;
    const corre = teclas.has('shift') || (J.ir && Math.hypot(J.ir.x - J.x, J.ir.z - J.z) > 7);
    const v = corre ? 6.4 : 4, nx = J.x + dx * v * dt, nz = J.z + dz * v * dt;
    if (libre(nx, nz)) { J.x = nx; J.z = nz; J.atasco = 0; } else if (libre(nx, J.z)) J.x = nx; else if (libre(J.x, nz)) J.z = nz;
    else if ((J.atasco += dt) > .5) { if (J.ir?.hacer && Math.hypot(J.ir.x - J.x, J.ir.z - J.z) < 2.4) { const f = J.ir.hacer; J.ir = null; f(); } else J.ir = null; J.atasco = 0; }
    J.dir = angLerp(J.dir, Math.atan2(dx, dz), 1 - Math.exp(-14 * dt));
    andando = corre ? 2 : 1;
  }
  J.ch.position.set(J.x, J.sentado ? (dentro ? .28 : sueloEn(J.x, J.z) + .3) : sueloEn(J.x, J.z), J.z);
  J.ch.rotation.y = J.dir;
  const fasePrev = J.ch.userData.fase;
  animar(J.ch, dt, andando, t);
  if (andando && Math.floor(fasePrev / Math.PI) !== Math.floor(J.ch.userData.fase / Math.PI)) pasito();
}
function moverPNJ(dt, t) {
  for (const p of PNJ) {
    let andando = 0;
    if (p.hablando) { p.dir = angLerp(p.dir, Math.atan2(J.x - p.x, J.z - p.z), 1 - Math.exp(-8 * dt)); }
    else if (p.vel) {
      if (p.espera > 0) p.espera -= dt;
      else if (!p.obj) { for (let k = 0; k < 8; k++) { const a = rnd() * 6.28, r = rnd() * p.radio, x = p.casa[0] + Math.cos(a) * r, z = p.casa[1] + Math.sin(a) * r; if (libreFuera(x, z, .3, p)) { p.obj = { x, z }; break; } } if (!p.obj) p.espera = 1; }
      else {
        const vx = p.obj.x - p.x, vz = p.obj.z - p.z, d = Math.hypot(vx, vz);
        if (d < .2) { p.obj = null; p.espera = 2 + rnd() * 5; }
        else { const nx = p.x + vx / d * p.vel * dt, nz = p.z + vz / d * p.vel * dt; if (libreFuera(nx, nz, .3, p)) { p.x = nx; p.z = nz; andando = 1; p.dir = angLerp(p.dir, Math.atan2(vx, vz), 1 - Math.exp(-8 * dt)); } else { p.obj = null; p.espera = 1 + rnd() * 2; } }
      }
    }
    p.ch.position.set(p.x, p.y ?? sueloEn(p.x, p.z), p.z); p.ch.rotation.y = p.dir;
    animar(p.ch, dt, andando, t);
  }
  animar(MARGA.ch, dt, 0, t);
  MARGA.ch.rotation.y = dentro ? angLerp(MARGA.ch.rotation.y, Math.atan2(J.x - MARGA.x, J.z - MARGA.z), 1 - Math.exp(-4 * dt)) : 0;
}
// Lo que tienes cerca: el botón de acción
let cercano = null;
function buscarCercano() {
  cercano = null; if (enDialogo || J.sentado) { $('accion').style.display = 'none'; return; }
  let mejor = 1e9;
  for (const i of INTERACCION) { if (!!i.dentro !== dentro) continue; const q = posDe(i), d = Math.hypot(q.x - J.x, q.z - J.z); if (d < i.r && d < mejor) { mejor = d; cercano = i; } }
  const b = $('accion');
  if (cercano) { b.style.display = 'block'; b.innerHTML = `${cercano.accion}<kbd>E</kbd>`; } else b.style.display = 'none';
}
$('accion').addEventListener('pointerdown', (e) => { e.stopPropagation(); arrancarAudio(); if (cercano) usar(cercano); });
// Etiquetas con el nombre encima de los vecinos cercanos
const etiquetas = new Map();
function pintarEtiquetas() {
  for (const p of [...PNJ, MARGA]) {
    let el = etiquetas.get(p);
    const visible = !enDialogo && (p === MARGA ? dentro : !dentro) && Math.hypot(p.ch.position.x - J.x, p.ch.position.z - J.z) < 7.5;
    if (!visible) { if (el) el.style.display = 'none'; continue; }
    if (!el) { el = document.createElement('div'); el.className = 'etiqueta'; el.textContent = p.nombre; el.style.background = p.color; document.body.appendChild(el); etiquetas.set(p, el); }
    const v = new THREE.Vector3(p.ch.position.x, p.ch.position.y + (p.id === 'gato' ? .9 : 1.95) - (dentro ? 0 : bajada(p.ch.position.z)), p.ch.position.z).project(camara);
    el.style.display = 'block'; el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
  }
}

// =============================================================
//  BUCLE
// =============================================================
const mirar = new THREE.Vector3(), mirarObj = new THREE.Vector3(), posObj = new THREE.Vector3();
let miradaM = 0, parpadeoM = 4;
camara.position.set(J.x, 10.8, J.z + 10.6); mirar.set(J.x, .7, J.z - 1.6);
function camaraSigue(dt) {
  if (dentro) { posObj.set(Math.min(X0 + 2.5, Math.max(X0 - 2.5, J.x * .4 + X0 * .6)), 8.4, 12.6); mirarObj.set(posObj.x, .6, -.4); }
  else if (modoCam === 'mirador') { posObj.set(J.x + 3, J.ch.position.y + 4.6, J.z + 7); mirarObj.set(CABEZA.x + 3, CABEZA.y - 1 - bajada(CABEZA.z), CABEZA.z + 8); }
  else { posObj.set(J.x, J.ch.position.y + 10.8, J.z + 10.6); mirarObj.set(J.x, J.ch.position.y + .7, J.z - 1.6); }
  const k = 1 - Math.exp(-(modoCam === 'mirador' ? 1.6 : 5) * dt);
  camara.position.lerp(posObj, k); mirar.lerp(mirarObj, k); camara.lookAt(mirar);
  if (!dentro) {
    CURVA.uAncla.value = J.z;
    // En el mirador el mundo se abre: se curva menos y se ve el mar y a Morrandar.
    const base = Number(prm.get('curva')) || 0.0105;
    CURVA.uCurva.value += ((modoCam === 'mirador' ? .0032 : base) - CURVA.uCurva.value) * (1 - Math.exp(-1.2 * dt));
  }
}
function animarMundo(dt, t) {
  texAgua.offset.x = t * .006; texAgua.offset.y = t * .004;
  libro.position.y = 1.35 + Math.sin(t * 1.6) * .06; libro.rotation.y = Math.sin(t * .5) * .08;
  // Morrandar: respira, mira a un lado y a otro… y a ti, si te sientas en el mirador
  const haciaTi = Math.atan2(J.x - CABEZA.x, J.z - CABEZA.z), giroTi = Math.PI + Math.max(-1.25, Math.min(1.25, ((haciaTi - Math.PI + Math.PI * 3) % (Math.PI * 2)) - Math.PI));
  const objetivoGiro = miradaM ? giroTi : Math.PI + Math.sin(t * .11) * .4;
  cabezaM.rotation.y = angLerp(cabezaM.rotation.y, objetivoGiro, 1 - Math.exp(-.6 * dt));
  cabezaM.position.y = CABEZA.y + Math.sin(t * .5) * .3; cabezaM.rotation.x = Math.sin(t * .37) * .04;
  parpadeoM -= dt; const cierra = parpadeoM < .18; for (const p of parpados) p.scale.y = cierra ? 1 : .15; if (parpadeoM < 0) parpadeoM = 3 + Math.random() * 4;
  if (modoCam !== 'mirador') miradaM = 0;
  for (const a of aletas) { const u = a.userData; a.rotation.y = u.giro + Math.sin(t * .45 + u.fase) * .25; a.position.y = AGUA - .25 + Math.sin(t * .45 + u.fase) * .15; }
  for (const n of nubes) { n.position.x += n.userData.v * dt; if (n.position.x > 80) n.position.x = -80; }
  for (const m of mariposas) { const u = m.userData; u.fase += dt; m.position.set(u.cx + Math.sin(u.fase * .7) * 2.2, alto(m.position.x, m.position.z) + .9 + Math.sin(u.fase * 2.3) * .3, u.cz + Math.cos(u.fase * .5) * 1.8); m.children[0].rotation.y = Math.sin(u.fase * 18) * .9; m.children[1].rotation.y = -Math.sin(u.fase * 18) * .9; m.rotation.y = u.fase * .6; }
  if (dentro) { for (const [i, f] of cantinaDentro.userData.llamas.entries()) f.scale.y = .8 + Math.sin(t * 9 + i * 2) * .2 + Math.random() * .1; luzFuego.intensity = 20 + Math.sin(t * 11) * 3 + Math.random() * 3; }
  // las olas suenan más cerca de la playa
  if (A.ctx && A.olas) A.olas.gain.setTargetAtTime(dentro ? 0 : .02 + .1 * suave(4, 22, J.z) + .05 * suave(26, 32, Math.abs(J.x)), A.ctx.currentTime, .4);
}
let ultimo = performance.now();
render.setAnimationLoop((ahora) => {
  const dt = Math.min(.05, (ahora - ultimo) / 1000); ultimo = ahora; const t = ahora / 1000;
  moverJugador(dt, t); moverPNJ(dt, t); animarMundo(dt, t); camaraSigue(dt); buscarCercano();
  render.render(escena, camara); pintarEtiquetas();
});
setTimeout(() => { $('fundido').style.opacity = 0; aviso(`Bienvenido a casa, ${NOMBRE}`); }, 250);
window.pueblo = { J, PNJ, escena, camara, entrarCantina, salirCantina, sentarseMirador, CURVA, A, arrancarAudio };
</script>
